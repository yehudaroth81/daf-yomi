<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>סוכה בריצה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@500;600&display=swap">
<style>
/* Layout: sticky control bar; slide = text column (Gemara + explanation) beside the logic flow; bottom line closes each slide. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18202E; --muted:#5A6375; --line:#DCE1E8; --accent:#24477A; --accent-ink:#FFFFFF;
  --t-verse:#8A5A2B; --t-drasha:#0E7A84; --t-scene:#9C4F86; --sch:#3E8A3A; --sky:#E9F1F8;
  --t-source:#5E6B80; --t-question:#A06400; --t-kushya:#BF3A2B; --t-proof:#2563A8; --t-answer:#23804F; --t-rejection:#BF560D; --t-conclusion:#6D44A8;
  --f-text:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-ui:"Assistant","Segoe UI",Arial,sans-serif;
  --f-rashi:"Noto Rashi Hebrew","Frank Ruhl Libre",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#171C25; --ink:#E6EAF0; --muted:#9AA3B2; --line:#2A313D; --accent:#8FB2E8; --accent-ink:#0F131A;
  --t-source:#A4AFC2; --t-question:#E3A93B; --t-kushya:#F07A6C; --t-proof:#73A8EE; --t-answer:#5BC48A; --t-rejection:#F2955A; --t-conclusion:#B595EC;
  --t-verse:#D6A774; --t-drasha:#58C6CF; --t-scene:#DA8FC6; --sch:#6CC067; --sky:#162232;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C25; --ink:#E6EAF0; --muted:#9AA3B2; --line:#2A313D; --accent:#8FB2E8; --accent-ink:#0F131A;
  --t-source:#A4AFC2; --t-question:#E3A93B; --t-kushya:#F07A6C; --t-proof:#73A8EE; --t-answer:#5BC48A; --t-rejection:#F2955A; --t-conclusion:#B595EC;
  --t-verse:#D6A774; --t-drasha:#58C6CF; --t-scene:#DA8FC6; --sch:#6CC067; --sky:#162232;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-text);font-size:1.25rem;font-weight:700}
.brand span{font-family:var(--f-rashi);color:var(--muted);font-size:.9rem}
.progress{display:flex;gap:4px;flex:1 1 220px;min-width:0}
.progress button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}
.progress button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.progress button.cur{background:var(--accent)}
.progress button.ok{box-shadow:0 0 0 2px color-mix(in srgb,var(--t-answer) 70%,transparent) inset}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);min-width:4.5em;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip-btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.9rem}
.chip-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}

/* slide head */
main{padding-block:22px 120px}
.eyebrow{font-family:var(--f-rashi);color:var(--muted);font-size:.92rem;letter-spacing:.02em}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-end;margin-bottom:18px}
.head h1{font-family:var(--f-text);font-size:clamp(1.55rem,3.2vw,2.2rem);line-height:1.25;margin:4px 0 8px;text-wrap:balance;font-weight:700}
.speakers{display:flex;flex-wrap:wrap;gap:6px}
.spk{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.spk small{color:var(--muted);margin-inline-start:4px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.head-actions a{color:var(--accent);font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px}
.head-actions a:hover{border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--t-question);background:color-mix(in srgb,var(--t-question) 10%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:16px}

/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel-title{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 10px}

.gemara{display:grid;gap:14px}
.seg-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline}
.ref{font-family:var(--f-rashi);font-size:.75rem;color:var(--muted);white-space:nowrap}
.gtext{font-family:var(--f-text);font-size:1.32rem;line-height:2.05;margin:0}
.gtext [data-n]{--c:var(--muted);background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 70%,transparent);border-radius:3px;padding:1px 2px;cursor:pointer;transition:opacity .15s,background .15s}
.gtext [data-n].hidden-step{background:transparent;box-shadow:none;cursor:default}
.has-active .gtext [data-n]:not(.on){opacity:.38}
.has-active .gtext [data-n].on{background:color-mix(in srgb,var(--c) 28%,transparent)}

.explain{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:grid;gap:10px}
.explain p{margin:0;max-width:68ch;font-size:1.02rem;padding-inline-start:12px;border-inline-start:2px solid transparent;transition:opacity .15s}
.explain p b{font-family:var(--f-text);font-weight:700;font-size:1.06em}
.explain p.on{border-inline-start-color:var(--c)}
.has-active .explain p:not(.on){opacity:.45}

/* flow */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-inline-end:5px;vertical-align:middle}
.flow{display:grid;gap:10px}
.node{--c:var(--muted);position:relative;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:10px;padding:10px 12px;cursor:pointer;margin-inline-start:calc(var(--d,0) * 22px);transition:opacity .2s,transform .2s,box-shadow .15s}
.node[data-d]:not([data-d="0"])::before{content:"";position:absolute;inset-inline-start:-14px;top:-11px;width:12px;height:30px;border-inline-start:2px solid var(--line);border-bottom:2px solid var(--line);border-end-start-radius:8px}
.node .top{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:3px}
.pill{font-size:.74rem;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:999px;padding:0 8px}
.who{font-size:.8rem;color:var(--muted);font-weight:600}
.onto{font-size:.74rem;color:var(--muted);margin-inline-start:auto}
.node .txt{font-size:.98rem}
.node.on{box-shadow:0 0 0 2px var(--c)}
.has-active .node:not(.on){opacity:.5}
.node.pending{opacity:.0;transform:translateY(4px);pointer-events:none;height:0;padding:0;border:0;margin:0;overflow:hidden}
.node.pending::before{display:none}
@media (prefers-reduced-motion:reduce){.node,.gtext [data-n],.explain p{transition:none}}

.widget{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.widget h3{font-size:.95rem;margin:0 0 8px}
.wtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:center}
th{color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--line) 35%,transparent)}
td.rowh{font-weight:600;text-align:start}
td.diff{background:color-mix(in srgb,var(--t-question) 18%,transparent);font-weight:700}
.wnote{font-size:.78rem;color:var(--muted);margin-top:6px}

.bottomline{margin-top:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 18px}
.bottomline .lbl{font-family:var(--f-rashi);font-size:.85rem;opacity:.75;white-space:nowrap}
.bottomline p{margin:0;font-family:var(--f-text);font-size:1.18rem;font-weight:500;text-wrap:balance}

/* nav */
.nav{position:fixed;inset:auto 0 0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:10px}
.nav .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.nav .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav .btn:disabled{opacity:.4;cursor:default}
.keys{font-size:.8rem;color:var(--muted)}
@media (max-width:600px){.keys{display:none}}

/* summary */
.sum-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.sum-grid{grid-template-columns:minmax(0,1fr)}}
.times{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:.88rem}
.trow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .barbg{height:10px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:5px;overflow:hidden}
.trow .barf{height:100%;background:var(--accent);border-radius:5px}
.trow .v{font-variant-numeric:tabular-nums;text-align:end;color:var(--muted)}
.total{font-family:var(--f-text);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.quiz{display:grid;gap:12px}
.qi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.qi .q{font-weight:600;margin-bottom:6px}
.qi .ans{margin:8px 0;color:var(--ink);font-family:var(--f-text);font-size:1.05rem}
.qi .row{display:flex;gap:8px;flex-wrap:wrap}
.qi .row button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.88rem}
.qi .row button[aria-pressed="true"].yes{border-color:var(--t-answer);color:var(--t-answer);font-weight:700}
.qi .row button[aria-pressed="true"].no{border-color:var(--t-kushya);color:var(--t-kushya);font-weight:700}
.score{font-weight:700}
.credits{font-size:.8rem;color:var(--muted);margin-top:28px;max-width:80ch}
.credits a{color:inherit}
.copied{font-size:.85rem;color:var(--t-answer);margin-inline-start:8px}
.node.pause{border-style:dashed;background:transparent}
.node.pause .txt{font-weight:600;color:var(--c)}
.bridge{margin:0;max-width:68ch}
.bridge b{font-family:var(--f-text)}
.map{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.maprow{width:100%;display:grid;grid-template-columns:1.8em minmax(0,1fr) auto 3.2em;gap:10px;align-items:center;text-align:start;border:0;border-radius:8px;background:transparent;padding:7px 8px;cursor:pointer}
.maprow:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mk{font-family:var(--f-rashi);color:var(--muted);text-align:center}
.mt{font-weight:600;min-width:0}
.ma,.mm{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qi .row button.opt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.dinim{margin-bottom:20px}
.dinim ol{margin:0;padding-inline-start:1.4em;display:grid;gap:6px;font-family:var(--f-text);font-size:1.12rem}
.dinim b{font-weight:700}
.pre-check{margin-bottom:20px;display:grid;gap:10px}
.pq .q{font-weight:600}
.pq .guess{font-size:.9rem;color:var(--muted)}
.pq .ans{font-family:var(--f-text);font-size:1.05rem}
.dafsel select{font:inherit;font-family:var(--f-rashi);font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.when{display:block;font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:2px}
.dfields{display:grid;gap:8px}
.dfields label{display:grid;grid-template-columns:minmax(0,1fr) 6.5em auto;gap:8px;align-items:center;font-size:.92rem}
.dfields input{font:inherit;width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.dfields small{color:var(--muted)}
.dres{margin-top:10px;font-size:1.05rem}
.dres b{font-family:var(--f-text);font-size:1.3rem;color:var(--t-conclusion);font-variant-numeric:tabular-nums}
.verses{margin-top:16px;display:grid;gap:10px}
.verse{--c:var(--t-verse);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:10px;padding:10px 14px;transition:opacity .15s}
.verse.vhide{opacity:.25}
.has-active .verse[data-n]:not(.on){opacity:.45}
.verse.on{box-shadow:0 0 0 2px var(--c)}
.vhead{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);font-family:var(--f-rashi)}
.vhead a{color:var(--accent);text-decoration:none;font-family:var(--f-ui)}
.vtext{margin:4px 0 0;font-family:var(--f-text);font-size:1.22rem;line-height:2}
.vk{background:color-mix(in srgb,var(--c) 18%,transparent);color:inherit;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 65%,transparent)}
.vk sup{font-family:var(--f-ui);font-size:.62em;font-weight:700;color:var(--c);margin-inline-end:2px}
.discuss{margin-top:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border:1.5px dashed var(--t-scene);border-radius:12px;padding:12px 18px}
.discuss .lbl{font-family:var(--f-rashi);font-size:.85rem;color:var(--t-scene);white-space:nowrap}
.discuss p{margin:0;font-size:1.05rem;font-weight:600}
.where{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.where summary{cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.tree{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.tr button{width:100%;text-align:start;border:0;background:transparent;cursor:pointer;padding:5px 8px;padding-inline-start:calc(8px + var(--d)*18px);border-radius:6px;font-size:.92rem;position:relative}
.tr button::before{content:"";position:absolute;inset-inline-start:calc(var(--d)*18px - 6px);top:50%;width:8px;border-top:1.5px solid var(--line)}
.tr[style*="--d:0"] button::before{display:none}
.tr button:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tr.side button{color:var(--muted);font-style:italic}
.tr.past button{color:var(--muted)}
.tr.cur button{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tr .tag{font-style:normal;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-inline-end:6px}
.tl-wrap{overflow-x:auto}
.tl{position:relative;min-width:440px;padding-top:calc(var(--rows)*42px + 6px);padding-bottom:34px}
.tl-pts{position:absolute;inset:0 0 34px 0}
.tl-pt{position:absolute;bottom:calc(var(--r)*42px + 10px);transform:translateX(50%);text-align:center;display:grid;font-size:.8rem;line-height:1.25;white-space:nowrap;padding:3px 7px;border-radius:7px;background:color-mix(in srgb,var(--t-proof) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--t-proof) 45%,transparent)}
.tl-pt::after{content:"";position:absolute;left:50%;bottom:calc(-10px - var(--r)*42px);height:calc(10px + var(--r)*42px);border-left:1.5px solid color-mix(in srgb,var(--t-proof) 55%,transparent)}
.tl-pt span{color:var(--muted);font-size:.74rem}
.tl-pt.start{background:color-mix(in srgb,var(--t-answer) 14%,var(--surface));border-color:color-mix(in srgb,var(--t-answer) 50%,transparent)}
.tl-pt.end{background:color-mix(in srgb,var(--t-conclusion) 12%,var(--surface));border-color:color-mix(in srgb,var(--t-conclusion) 50%,transparent)}
.tl-pt.clash{background:color-mix(in srgb,var(--t-kushya) 16%,var(--surface));border-color:var(--t-kushya)}
.tl-pt.clash span{color:var(--t-kushya);font-weight:700}
.tl-axis{position:absolute;inset:auto 0 0 0;height:34px;border-top:2px solid var(--ink)}
.tl-tick{position:absolute;top:0;transform:translateX(50%);font-size:.74rem;color:var(--muted);white-space:nowrap;padding-top:6px;font-family:var(--f-rashi)}
.tl-tick i{position:absolute;top:-6px;left:50%;height:8px;border-left:2px solid var(--ink)}
.sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile{display:grid;justify-items:center;min-width:3.2em;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tile b{font-family:var(--f-text);font-size:1.25rem}
.tile small{color:var(--muted);font-variant-numeric:tabular-nums}
.tile.total{border-color:var(--t-drasha);background:color-mix(in srgb,var(--t-drasha) 12%,var(--surface))}
.tile.total b{color:var(--t-drasha);font-variant-numeric:tabular-nums}
.op{color:var(--muted);font-weight:700}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ladder li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 10px;margin-inline-start:calc(var(--k)*10px);border-radius:8px;border:1px solid var(--line)}
.ladder .ln{font-family:var(--f-text);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.ladder .lw{font-weight:600;font-size:.92rem}
.ladder .lw small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.ladder .lr{font-size:.74rem;color:var(--t-rejection);border:1px solid var(--t-rejection);border-radius:999px;padding:0 7px}
.ladder li.past{opacity:.55}
.ladder li.next{opacity:.35}
.ladder li.cur{border-color:var(--t-drasha);background:color-mix(in srgb,var(--t-drasha) 12%,var(--surface))}

כה. **מבוי דרבנן**: הקורה כולה תקנת חכמים, והמשנה היא תחילת ההוראה. לכן היא מלמדת את התקנה, ולא ״פוסלת״."], ["a2", "תירוץ שני: גם בדין תורה אפשר לשנות תקנה. אבל בסוכה **נפישי מילתה**: המשנה מונה כמה פסולים, ולכל אחד תיקון אחר (רש״י). קצר יותר לכלול את כולם במילה אחת: **פסולה**. במבוי יש רק דין אחד, ולכן מספיק **ימעט**."]], "nodes": [{"id": "m", "type": "source", "label": "משנה בעירובין", "text": "מבוי גבוה מעשרים אמה: ימעט"}, {"id": "y", "type": "source", "label": "רבי יהודה", "to": "m", "text": "אינו צריך"}, {"id": "q", "type": "question", "label": "מאי שנא", "text": "למה ״פסולה״ בסוכה ו״ימעט״ במבוי?"}, {"id": "a1", "type": "answer", "label": "תירוץ א׳", "to": "q", "text": "סוכה מן התורה, מבוי מדרבנן"}, {"id": "a2", "type": "answer", "label": "תירוץ ב׳ (איבעית אימא)", "to": "q", "text": "בסוכה פסולים רבים: מילה אחת לכולם"}], "verses": [], "widgets": [{"type": "views", "title": "סוכה ומבוי באותו גובה", "cols": ["", "סוכה", "מבוי"], "views": [{"name": "", "rows": [["הלשון במשנה", "פסולה", "ימעט"], ["מקור הדין", "מן התורה", "מדרבנן"], ["כמה דינים באותה משנה", "ארבעה פסולים", "דין אחד"]]}]}], "bottom": "בדין תורה המשנה ״פוסלת״; בתקנת חכמים היא מלמדת איך לתקן.", "qs": [{"q": "מה דומה בין סוכה למבוי במשנה, ומה שונה?", "a": "בשניהם הגבול הוא עשרים אמה ורבי יהודה מקל; שונה הלשון: בסוכה ״פסולה״ ובמבוי ״ימעט״."}, {"q": "לפי התירוץ הראשון, למה לא מתאים לומר ״פסול״ על מבוי?", "a": "הקורה במבוי היא תקנת חכמים, והמשנה היא תחילת ההוראה; אין דין קודם שלפיו הוא ״פסול״."}, {"q": "לפי התירוץ השני, מה היה קורה אילו המשנה בסוכה הייתה כותבת תיקון?", "a": "היא הייתה צריכה לכתוב ארבעה תיקונים שונים; לכן קיצרה במילה אחת: פסולה."}], "bagrut": {"sugya": "סוגיה 1 בתוכנית: הבדל בין סוכה למבוי (ב ע״א)", "real": true, "exam": {"code": "006281", "name": "תלמוד, מסכת סוכה", "year": "קיץ תשפ״ג (2023)", "q": "שאלה 1", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628183k.pdf"}, "key": {"label": "דגם התשובות הרשמי של משרד החינוך, קיץ תשפ״ג", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628182kt.pdf"}, "text": "סוכה, מבוי ונר חנוכה\n״סוכה שהיא גבוהה למעלה מעשרים אמה... פסולה. מבוי שהוא גבוה מעשרים אמה... ימעט. סוכה דאורייתא תני פסולה, מבוי דרבנן תני תקנתא.״\nא. על פי רש״י, הסבירו את תירוץ הגמרא המצוטט. (3 נקודות)\nב. עיינו בהסבר הראשון של בעלי התוספות לתירוץ הגמרא, וענו על פי הסבר זה על השאלות שלפניכם:\n(1) ציינו איזו מן המילים ״פסולה״ או ״ימעט״ נחשבת ״לישנא מעליא״, והסבירו מדוע היא נחשבת כך.\n(2) מדוע בנוגע לסוכה נקטה המשנה לשון ״פסולה״, ובנוגע למבוי נקטה לשון ״ימעט״? (5 נקודות)\nג. בעלי התוספות הִקשו מברייתא במסכת שבת: ״נר חנוכה שהניחה למעלה מעשרים אמה פסולה, כסוכה וכמבוי.״\n(1) הסבירו את קושיית בעלי התוספות.\n(2) הסבירו אחד מן התירוצים של בעלי התוספות לקושייתם. (4 נקודות)", "answer": "א. בנוגע לסוכה – שמקור דין גובהה הוא מדאורייתא ונאמר בסיני – מתאים לִשְנות ״פסולה״, דהיינו שלא נעשתה כתורה וכהלכה. אבל בנוגע למבוי – שמקור דינו הוא מדרבנן – אין זה מתאים לִשְנות ״פסול״, מכיוון שהמשנה היא תחילת הוראתו ומצוותו, ולכן שנה התנא בלשון תקנה – ״ימעט״.\nב. (1) המילה ״ימעט״ היא ״לישנא מעליא״, כי היא מציעה תקנה ולא קובעת פסול, שהוא דבר מגונה.\n(2) בנוגע לסוכה, שהיא מדאורייתא, נקטה המשנה לשון ״פסולה״ מחשש שאם תנקוט לשון ״ימעט״ יובן בטעות שהכוונה היא שימעט לכתחילה, ובדיעבד כשרה אף אם לא מיעט, ועל ידי זה יעברו על מצוות עשה של סוכה. אבל בנוגע למבוי, שהוא מדרבנן, לא חששו להבנה לא נכונה, והעדיף התנא לנקוט ״לישנא מעליא״ – ״ימעט״. (תוד״ה ״דאורייתא״)\nג. (1) מדוע בנוגע לנר חנוכה, שהוא מדרבנן, נקטה הגמרא במסכת שבת לשון ״פסולה״ ולא נקטה לשון ״ימעט״ כמו במבוי, שגם הוא מדרבנן?\n(2) – מכיוון שהזכירה הגמרא במסכת שבת שנר חנוכה פסול ״כסוכה״, ובנוגע לסוכה, שהיא מדאורייתא, מתאים לומר ״פסולה״, נקטה גם בנוגע לנר חנוכה לשון ״פסולה״.\n– אילו הייתה הגמרא במסכת שבת נוקטת לשון ״ימעט״, היה משמע שצריך להשפיל את נר החנוכה הדלוק כפי שהוא, ואין זה נכון, אלא צריך להדליק את הנר שוב לאחר השפלתו [לפי מי שסובר שהדלקה עושה מצווה. וגם לפי מי שסובר שהנחה עושה מצווה, אין להשפיל את נר חנוכה הדלוק כפי שהוא, כדי שלא ייראה שלצורכו הוא מדליק].\n[הערה למעריכים:  "walls": false, "width": 4, "mountains": false, "iron": false}}], "bottom": "לרבה סוכה היא מקום שיודעים שיושבים בו, וזה נמדד במה שהעין רואה.", "qs": [{"q": "מה בדיוק צריך ״לדעת״ לפי רבה?", "a": "שהוא יושב בסוכה, כלומר תחת הסכך; לכן העין צריכה לראות את הסכך."}, {"q": "מה משתנה מעל עשרים אמה?", "a": "העין כבר לא פוגשת את הסכך מעצמה, ואדם לא שם לב שהוא בסוכה."}, {"q": "איזה שינוי בסוכה גבוהה היה פותר את הבעיה לפי רבה?", "a": "שינוי שמוביל את העין לסכך, למשל דפנות שמגיעות עד הסכך. הגמרא תגיע לזה בעמוד ב."}], "refs": ["2a:7", "2a:8"], "vilna": {"pages": [{"img": "vilna/Sukkah_2a.jpg", "amud": "2a", "w": 800, "h": 1315, "rects": [[300, 496, 225, 98]], "crop": [270, 466, 295, 158], "more": false}], "open": "מנה״מ אמר רבה"}, "min": 1.25}, {"id": "a4", "amud": "ב׳ ע״א", "kind": "גמרא", "title": "רבי זירא: ״וסוכה תהיה לצל יומם״", "speakers": [["רבי זירא", "אמורא"], ["אביי", "אמורא בבל"]], "text": [["2a:9", "{v|רבי זירא אמר מהכא (ישעיהו ד, ו) וסוכה תהיה לצל יומם מחורב} {r|עד עשרים אמה אדם יושב בצל סוכה} {p|למעלה מעשרים אמה אין אדם יושב בצל סוכה אלא בצל דפנות}"], ["2a:10", "{k|א\"ל אביי אלא מעתה העושה סוכתו בעשתרות קרנים הכי נמי דלא הוי סוכה}"], ["2a:11", "{a|א\"ל התם דל עשתרות קרנים איכא צל סוכה הכא דל דפנות ליכא צל סוכה}"]], "explain": [["v", "**רבי זירא** לומד מ**״וסוכה תהיה לצל יומם״**: סוכה היא מה שעושה **צל**. לפי רש״י, אין סכך אלא מה שעשוי לצל."], ["r", "**עד עשרים אמה** הצל על היושב בא מה**סכך**."], ["p", "**מעל עשרים אמה** הדפנות גבוהות כל כך, שלפי רש״י הצללים שלהן מגיעים זה לזה ומכסים את הסוכה. האדם יושב **בצל דפנות**, והסכך לא משנה דבר."], ["k", "**אביי** מקשה: אם כך, מי שבנה סוכה **בעשתרות קרנים**, בין שני הרים גבוהים שהשמש לא מגיעה ביניהם (רש״י), גם שם הצל לא מהסכך. וכי גם זו לא סוכה?"], ["a", "**רבי זירא**: **דל עשתרות קרנים**: תוריד בדמיון את ההרים, ונשאר **צל סוכה**, כי הסוכה עצמה בנויה כהלכה. אבל בסוכה הגבוהה, **דל דפנות**: תוריד את הדפנות, והשמש נכנסת מתחת לסכך (רש״י). **ליכא צל סוכה**."]], "nodes": [{"id": "v", "type": "drasha", "label": "הפסוק", "who": "רבי ], "nodes": [{"id": "r", "type": "rejection", "label": "על רבה", "text": "הפסוק עוסק בידיעה של הדורות"}, {"id": "z", "type": "rejection", "label": "על רבי זירא", "text": "הפסוק עוסק בימות המשיח"}, {"id": "za", "type": "answer", "label": "רבי זירא משיב", "to": "z", "text": "״וסוכה״ ולא ״וחופה״: שמעת מינה תרתי"}, {"id": "ra", "type": "rejection", "label": "על רבא", "text": "קושיית אביי: מחיצות של ברזל"}], "verses": [], "widgets": [{"type": "views", "title": "שלושה טעמים, שלוש בעיות", "cols": ["", "הפסוק", "הטעם", "למה האחרים לא קיבלו"], "views": [{"name": "", "rows": [["רבה", "למען ידעו דורותיכם", "העין צריכה לראות את הסכך", "ידיעה לדורות, לא ליושב"], ["רבי זירא", "וסוכה תהיה לצל יומם", "צל מהסכך, לא מהדפנות", "פסוק על ימות המשיח"], ["רבא", "בסוכות תשבו שבעת ימים", "גובה של דירת עראי", "קושיית אביי: מחיצות ברזל"]]}]}], "bottom": "לכל טעם יש קושי, ולכן כל אמורא נשאר עם הפסוק שלו.", "qs": [{"q": "מה עונה רבי זירא לטענה שהפסוק שלו עוסק בימות המשיח?", "a": "הנביא בחר במילה ״סוכה״ ולא ״חופה״, וזה מלמד גם שסוכה היא דבר העשוי לצל: שמעת מינה תרתי."}, {"q": "למה, לפי רש״י, לא קיבלו את התירוץ של רבא לאביי?", "a": "לפי התירוץ התורה לא מקפידה באמת על עראי, ואז קשה ללמוד מהפסוק שיעור גובה."}, {"q": "איזה טעם עוסק בסכך, ואיזה בבניין כולו?", "a": "רבה ורבי זירא עוסקים בסכך (רואים אותו, יושבים בצלו); רבא עוסק במבנה כולו, בגובה שמאפשר דירת עראי."}], "bagrut": {"sugya": "סוגיה 2 בתוכנית: מדוע סוכה מעל 20 אמה פסולה (ב ע״א – ב ע״ב)", "real": true, "exam": {"code": "006281", "name": "תלמוד, מסכת סוכה", "year": "קיץ תשע״ז (2017)", "q": "שאלה 6", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628177.pdf"}, "key": {"label": "דגם התשובות הרשמי של משרד החינוך, קיץ תשע״ז", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/d-006281-06-17.pdf"}, "text": "סוכה גבוהה מעשרים אמה; סוכה — דירת עראי\nא. על פי הגמרא, יש שלושה טעמים של שלושה אמוראים לפסילת סוכה הגבוהה מעשרים אמה. הסבר מהי הבעיה בכל אחד מן הטעמים שבגללה שני האמוראים האחרים היו צריכים להציע טעם אחר. (5 נקודות)\nב. לפי רבא, סוכה צריכה להיות דירת עראי.\n(1) לפי התוספות, מהו גֶּדֶר עראי בנוגע לדפנות, ומהו גדר עראי בנוגע לסכך?\n(2) הסבר מדוע יש הבדל בין גדר עראי בנוגע לסכך ובין גדר עראי בנוגע לדפנות. (4 נקודות)", "answer": "א. הבעיה בטעם של רבה היא שטעמו מתבסס על כך שהפסוק ״למען יֵדעו דורותיכם״ עוסק בידיעה של היושב בסוכה, אבל אפשר להבין שהכוונה היא לידיעה של הדורות הבאים.\nהבעיה בטעם של רבי זירא היא שטעמו מתבסס על פסוק שעוסק בסוכה שהקב״ה יעשה בימות המשיח.\nהבעיה בטעם של רבא היא שעל פי טעמו יש לפסול גם סוכה נמוכה מעשרים אמה כאשר הסכך מונח על מחיצות של ברזל, כלומר בדרך קבע.\nב. (1) גדר עראי בנוגע לדפנות — אם יש אפשרות לעשות את הדפנות בדרך עראי (גם אם בפועל נבנו בדרך קבע). גדר עראי בנוגע לסכך — רק אם נבנה בפועל בדרך עראי.\n(2) יש הבדל בין גדר עראי בנוגע לסכך ובין גדר עראי בנוגע לדפנות כי עיקר הסוכה הוא הסכך. (תוד״ה ״כי״, ב ע״א)", "answerSource": "key", "more": [{"label": "6281 קיץ תשפ״ד, שאלה 1 (רבא, אביי ותוספות)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6281sh.pdf", "key": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/sh6281.pdf"}, {"label": "5281 קיץ תשפ״ד, שאלה 9 (רבא ואביי)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/5281she.pdf"}, {"label": "5281 קיץ תשע״ח, שאלה 8 (טעמו של רבי זירא)", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/528178.pdf"}, {"label": "6284 קיץ תשפ״ד, שאלה 1 (+ תשובון)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6284sh.pdf", "key": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6284ans.pdf"}]}, "refs": ["2b:1", "2b:2", "2b:3", "2b:4"], "vilna": {"pages": [{"img": "vilna/Sukkah_2b.jpg", "amud": "2b", "w": 800, "h": 1315, "rects": [[265, 159, 240, 98]], "crop": [235, 129, 310, 158], "more": false}], "open": "כולהו כרבה לא אמרי"}, "min": 1.25}]}, {"id": "suk2b", "daf": "סוכה ב׳–ג׳", "book": "Sukkah", "group": "מסכת סוכה · יחידת הגבר 5291 (ניסוי)", "kind": "סוגיה 3", "bridge": "אתמול: שלושה טעמים לפסול סוכה גבוהה מעשרים אמה: **רבה**, העין לא רואה את הסכך; **רבי זירא**, יושבים בצל הדפנות; **רבא**, זו דירת קבע. היום: שלוש אמירות בשם רב, **מתי גם חכמים מכשירים** סוכה גבוהה, ואיך הן מסתדרות עם **סוכת הילני המלכה**.", "pretest": [{"q": "סוכה גבוהה מעשרים אמה, אבל רחבה מאוד (10×10 אמות). כשרה?", "options": ["כן", "לא", "תלוי בטעם הפסול"], "a": "תלוי בטעם: לרב הונא, כטעם רבי זירא, כשרה כי יש בה צל סכך; לטעם רבה רוחב לא עוזר."}, {"q": "מלכה ישבה בסוכה גבוהה, והזקנים שתקו. מה אפשר ללמוד?", "options": ["שהסוכה כשרה", "כלום, היא פטורה", "תלוי איפה ישבו הבנים"], "a": "תלוי איפה ישבו הבנים: לרבנן הם ישבו בסוכה הגדולה והכשרה, ולרבי יהודה איתה בחדר הקטן."}], "quiz": [{"q": "למה רבי יאשיה מתאים לרבה?", "a": "כשהדפנות מגיעות לסכך, העין עולה איתן ורואה את הסכך."}, {"q": "למה רב הונא מתאים לרבי זירא?", "a": "בסוכה רחבה מארבע אמות יש מקום שבו יושבים בצל הסכך."}, {"q": "למה דברי רב חנן בר רבה ״לא כחד״?", "a": "סוכה קצת גדולה מהשיעור לא משנה לא את העין, לא את הצל ולא את הקבע."}, {"q": "במה נחלקו רב הונא ורב חנן, לפי המסקנה?", "a": "לא בגודל המזערי, אלא עד איזה גודל חכמים פוסלים סוכה גבוהה."}, {"q": "למה רבי יהודה הוסיף ״כל מעשיה על פי חכמים״?", "a": "כדי שגם חיוב דרבנן של בן קטן יחייב אותה להקפיד."}, {"q": "למה לפי רבנן לא העירו להילני?", "a": "היא ישבה בחדר הקטן משום צניעות, ובניה בסוכה הגדולה והכשרה."}], "dinim": ["**רבי יאשיה (רב)**: דפנות מגיעות לסכך: כשרה מעל 20 אמה; כרבה.", "**רב הונא (רב)**: יותר מ־4×4 אמות: כשרה; כרבי זירא.", "**רב חנן בר רבה (רב)**: יותר מראשו ורובו ושולחנו: כשרה; לא כאף טעם.", "**רב הונא ורב חנן**: לכולם המזערי הוא ראשו ורובו ושולחנו; נחלקו עד איזה גודל חכמים פוסלים.", "**הילני המלכה**: הזקנים שתקו; חכמים: אשה פטורה; רבי יהודה: שבעה בנים, ו״כל מעשיה על פי חכמים״.", "**קיטוניות שבה** (רב אשי): רבנן: הבנים בסוכה הגדולה; רבי יהודה: הבנים איתה בחדר הקטן."], "reviewFrom": [{"id": "suk2a", "n": 2, "when": "אתמול"}], "credits": "טקסט הגמרא: תלמוד בבלי, נוסח ויקיטקסט, דרך ספריא (CC-BY-SA). הפסוקים: ספריא. הביאור בשקפים בניסוח ובמבנה שלנו, על פי הגמרא עצמה, רש״י , "amud": "2b", "w": 800, "h": 1315, "rects": [[265, 507, 240, 213]], "crop": [235, 477, 310, 273], "more": false}], "open": "בשלמא דרבי יאשיה"}, "min": 1.5}, {"id": "b4", "amud": "ב׳ ע״ב", "kind": "ברייתא", "title": "מעשה בהילני המלכה", "speakers": [["רבי יהודה", "תנא"], ["חכמים", "תנאים"]], "text": [["2b:14", "{b|מיתיבי סוכה שהיא גבוהה למעלה מעשרים אמה פסולה ורבי יהודה מכשיר עד ארבעים וחמשים אמה}"], ["2b:15", "{m|אמר רבי יהודה מעשה בהילני המלכה בלוד שהיתה סוכתה גבוהה מעשרים אמה והיו זקנים נכנסין ויוצאין לשם ולא אמרו לה דבר} {r|אמרו לו משם ראייה אשה היתה ופטורה מן הסוכה} {a|אמר להן והלא שבעה בנים הוו לה} {a2|ועוד כל מעשיה לא עשתה אלא על פי חכמים}"], ["2b:16", "{q|למה לי למיתני ועוד כל מעשיה לא עשתה אלא על פי חכמים}"], ["2b:17", "{e1|הכי קאמר להו כי תאמרו בנים קטנים היו וקטנים פטורין מן הסוכה כיון דשבעה הוו אי אפשר דלא הוי בהו חד שאינו צריך לאמו}"], ["2b:18", "{e2|וכי תימרו קטן שאינו צריך לאמו מדרבנן הוא דמיחייב ואיהי בדרבנן לא משגחה ת\"ש ועוד כל מעשיה לא עשתה אלא ע\"פ חכמים}"]], "explain": [["b", "**מיתיבי**: מקשים על האמוראים מברייתא. בה **רבי יהודה מכשיר עד ארבעים וחמישים אמה**."], ["m", "ראייתו: **הילני המלכה** בלוד ישבה בסוכה **גבוהה מעשרים אמה**, וה**זקנים** נכנסו ויצאו **ולא אמרו לה דבר**."], ["r", "חכמים: **משם ראיה?** היא **אשה**, ו**פטורה מן הסוכה**. לא היה צורך להעיר לה."], ["a", "רבי יהודה: **והלא שבעה בנים הוו לה**, והם חייבים בסוכה."], ["a2", "**ועוד**: **כל מעשיה** עשתה **על פי חכמים**."], ["q", "שאלה על הברייתא: **למה לי** ה״ועוד״? מה הוא מוסיף?"], ["e1", "אם תאמרו **בנים קטנים היו**, וקטנים פטורים: מתוך **שבעה**, לפחות אחד היה גדול מספיק ש**אינו צריך לאמו**. לפי רש״י, קטן כזה חייב בסוכה מצד חינוך."], ["e2", "ואם תאמרו שחיוב הקטן הוא **רק מדרבנן**, והיא לא הקפידה על דברי חכמים: לכן הוסיף **״ועוד, כל מעשיה על פי חכמים״**."]], "nodes": [{"id": "b", "type": "source", "label": "ברייתא", "text": "רבי יהודה מכשיר עד 40–50 אמה"}, {"id": "m", "type": "proof", "label": "הראיה", "who": "רבי יהודה", "to": "b", "text": "הזקנים לא אמרו לה דבר"}, {"id": "r", "type -anchor=\"middle\" direction=\"rtl\">סוכה גדולה, וחדר קטן בתוכה</text></g><circle cx=\"150\" cy=\"226\" r=\"4.2\" fill=\"var(--t-scene)\"/><text x=\"140\" y=\"230\" fill=\"var(--muted)\" font-size=\"11.5\" font-weight=\"400\" text-anchor=\"start\" direction=\"rtl\">הילני</text><circle cx=\"290\" cy=\"226\" r=\"4.2\" fill=\"var(--ink)\"/><text x=\"280\" y=\"230\" fill=\"var(--muted)\" font-size=\"11.5\" font-weight=\"400\" text-anchor=\"start\" direction=\"rtl\">הבנים / בני הבית</text></svg>", "note": "שרטוט סכמטי, לא בקנה מידה. לפי הגמרא, רש״י ושטיינזלץ. מיקום הבנים בציור הימני להמחשה בלבד."}, {"type": "views", "title": "אותו מעשה, שתי קריאות", "cols": ["", "איפה ישבו הבנים", "מה מוכח"], "views": [{"name": "", "rows": [["רבנן", "בסוכה הגדולה והכשרה", "כלום: היא פטורה"], ["רבי יהודה", "איתה בחדר הקטן", "סוכה קטנה וגבוהה כשרה"]]}]}], "bottom": "אותו מעשה, שתי קריאות: איפה ישבו הבנים קובע מה אפשר ללמוד ממנו.", "qs": [{"q": "מה ההבדל בין ״קיטוניות קיטוניות״ לבין ״קיטוניות שבה״?", "a": "בראשון כל הסוכה מחולקת לחדרים קטנים; בשני זו סוכה גדולה ובתוכה חדר קטן."}, {"q": "לפי רבנן, למה הזקנים לא העירו להילני?", "a": "הבנים ישבו בחלק הגדול והכשר, והיא, הפטורה, ישבה בחדר הקטן; לא היה על מה להעיר."}, {"q": "מה צריך להניח כדי שהמעשה יוכיח כרבי יהודה?", "a": "שהבנים, החייבים בסוכה, ישבו עם אמם בחדר הקטן והגבוה, ובכל זאת לא אמרו לה דבר."}], "bagrut": {"sugya": "סוגיה 3(ב) בתוכנית: סיפור הילני המלכה (ב ע״ב – ג ע״א)", "real": false, "exam": null, "key": null, "text": "״אמר רבי יהודה: מעשה בהילני המלכה בלוד, שהיתה סוכתה גבוהה מעשרים אמה, והיו זקנים נכנסין ויוצאין לשם ולא אמרו לה דבר.״\nא. (1) מה ביקש רבי יהודה להוכיח מן המעשה, ומה השיבו לו חכמים?\n(2) הסבירו מדוע הוסיף רבי יהודה ״ועוד, כל מעשיה לא עשתה אלא על פי חכמים״. (6 נקודות)\nב. לפי השיטה שהמחלוקת היא בסוכה קטנה, הקשתה הגמרא: ״וכי דרכה של מלכה לישב בסוכה קטנה?״\nהסבירו את תירוצו של רב אשי, ובמה נחלקו לפיו רבנן ורבי יהודה. (6 נקודות)", "answer": "א. (1) רבי יהודה ביקש להוכיח שסוכה הגבוהה מעשרים אמה כשרה, שהרי הזקנים ראו ולא העירו. חכמים השיבו שהילני הייתה אשה, ואשה פטורה מן הסוכה, ולכן לא היה צורך להעיר לה.\n(2) אם יאמרו שבניה היו קטנים: משבעה בנים, לפחות אחד אינו צריך לאמו, וחייב בסוכה מדרבנן (חינוך). ואם יאמרו שבדרבנן היא לא הקפידה: ״כל מעשיה על פי חכמים״, ולכן הקפידה גם בחיוב דרבנן.\nב. רב אשי: הסוכה הייתה גדולה, והיו בה גם חדרים קטנים (״קיטוניות שבה״). לרבנן, הבנים ישבו בסוכה הגדולה והכשרה, והיא ישבה בחדר הקטן משום צניעות; היא פטורה, ולכן לא אמרו לה דבר. לרבי יהודה, הבנים ישבו איתה בחדר הקטן, ובכל זאת לא אמרו לה דבר, ומכאן שסוכה קטנה וגבוהה כשרה.", "answerSource": "own", "more": []}, "refs": ["3a:2", "3a:3"], "vilna": {"pages": [{"img": "vilna/Sukkah_3a.jpg", "amud": "3a", "w": 800, "h": 1315, "rects": [[285, 211, 258, 131]], "crop": [255, 181, 328, 191], "more": false}], "open": "וכי דרכה של מלכה"}, "min": 1.5}]}, {"id": "suk3a", "daf": "סוכה ג׳", "book": "Sukkah", "group": "מסכת סוכה · יחידת הגבר 5291 (ניסוי)", "kind": "סוגיה 4", "bridge": "אתמול: שלוש אמירות בשם רב על סוכה גבוהה, והילני המלכה שישבה ב**קיטוניות שבה**. היום: **מה הגודל המזערי** של סוכה, ומשנה מהפרק השני: **ראשו ורובו בסוכה ושולחנו בתוך הבית**.", "pretest": [{"q": "אדם יושב בפתח הסוכה, ראשו ורובו בפנים, והשולחן בתוך הבית. יצא ידי חובה?", "options": ["כן", "לא", "מחלוקת"], "a": "מחלוקת: בית שמאי, לא יצא (שמא ימשך אחר שולחנו); בית הלל, יצא."}, {"q": "סוכה שיש בה מקום לאדם אבל לא לשולחן. כשרה?", "options": ["כן", "לא", "מחלוקת"], "a": "מחלוקת: בית שמאי פוסלין ובית הלל מכשירין; רב שמואל בר יצחק פוסק כבית שמאי."}], "quiz": [{"q": "למה רבי אבא תמה על רב שמואל בר יצחק?", "a": "הוא פסק כבית שמאי, ובדרך כלל הלכה כבית הלל."}, {"q": "למה לבית שמאי אסור לשבת בפתח והשולחן בבית?", "a": "גזירה שמא ימשך אחר שולחנו ויאכל מחוץ לסוכה."}, {"q": "למה ״מי שהיה״ מראה שמדובר בסוכה גדולה?", "a": "זו לשון על האדם ומקום ישיבתו, לא על גודל הסוכה."}, {"q": "למה שתי הברייתות סותרות?", "a": "בראשונה חכמים דורשים גם שולחן, ובשנייה מסתפקים בראשו ורובו."}, {"q": "למה ״פוסלין ומכשירין״ מראה שמדובר בסוכה קטנה?", "a": "פסול וכשר אומרים על הסוכה; על אדם אומרים יצא או לא יצא."}, {"q": "איך מתיישבת המשנה בסוף?", "a": "בתרתי פליגי: המשנה חסרה, ויש בה מקרה של סוכה גדולה ומקרה של סוכה קטנה."}], "dinim": ["**רב שמואל בר יצחק**: הלכה, סוכה צריכה להחזיק **ראשו ורובו ושולחנו**: כבית שמאי, ״ולא תזוז מינה״.", "**רב נחמן בר יצחק**: אולי נחלקו בסוכה גדולה: יושב בפתח והשולחן בבית; בית שמאי גוזרים שמא ימשך.", "**שתי ברייתות**: חכמים עם שולחן ובלי שולחן: אחת כבית שמאי ואחת כבית הלל.", "**מר זוטרא**: ״פוסלין ומכשירין״ הוא לשון על הסוכה.", "**בתרתי פליגי**, חסורי מיחסרא: בסוכה גדולה ״יצא / לא יצא״; בסוכה קטנה ״פוסלין / מכשירין״."], "reviewFrom": [{"id": "suk2b", "n": 2, "when": "אתמול"}, {"id": "suk2a", "n": 1, "when": "שלשום"}], "credits": "טקסט הגמרא: תלמוד בבלי, נוסח ויקיטקסט, דרך ספריא (CC-BY-SA). הפסוקים: ספריא. הביאור בשקפים בניסוח ובמבנה שלנו, על פי הגמרא עצמה, רש״י ותוספות (מתוך ספריא, נחלת הכלל) וביאור הרב שטיינזלץ לתלמוד הבבלי (מהדורת William Davidson, ספריא, ברישיון CC BY-NC 4.0: https://creativecommons.org/licenses/by-nc/4.0/). דברי שטיינזלץ עובדו ונוסחו מחדש, ואינם מובאים כלשונם; השימוש אינו מסחרי. להבנת הסוגיה נעזרנו גם ב״תלמוד בבלי המבואר – שפה ברורה״ (עוז והדר), ככלי עזר להבנה בלבד ולא כמקור לניסוח. נבדק מול טבלאות כולל עיון הדף (dafyomi.co.il). דף הש״ס: וילנא, דרך ספריא. תוכנית הלימודים: משרד החינוך, ״מסכת סוכה תשפ״ז, יחידת ההגבר 5291״ (meyda.education.gov.il). שאלות הבגרות בשכבת ״שאלת בגרות״: מתוך שאלוני בגרות ודגמי תשובות שפרסם משרד החינוך (©), עם קישור למקור; שאלות המסומנות ״ניסוח עצמי״ נכתבו כאן. גרסת ניסוי פרטית; מכיל קטעי שאלוני בגרות של משרד החינוך (©), להסרה. לפני כל פרסום פומבי יש להחליף את נוסח השאלות האמיתיות בקישורים ובשאלות בניסוח עצמי.", "deepen": null, "multi": false, "tree": null, "ladder": null, "timeline": null, "summaryTitle": null, "lessons": {"hadran": "sukkah", "kih": "sukah/hebcharts/su-tl-", "yt": "מסכת סוכה"}, "slides": [{"id": "c1", "amud": "ג׳ ע״א", "kind": "גמרא", "title": "רב שמואל בר יצחק: ראשו ורובו ושולחנו", "speakers": [["רב שמואל בר יצחק", "אמורא"], ["רבי אבא", "אמורא"]], "text": [["3a אותן: שני מקרים במקום אחד."}, {"q": "איך התירוץ מסביר גם את הדיוק של רב נחמן וגם את של מר זוטרא?", "a": "״מי שהיה... יצא / לא יצא״ שייך למקרה של סוכה גדולה; ״פוסלין ומכשירין״ שייך למקרה של סוכה קטנה."}, {"q": "לפי זה, האם הפסק של רב שמואל בר יצחק עומד?", "a": "כן: בית שמאי ובית הלל נחלקו גם בגודל הסוכה, והוא פסק כבית שמאי שצריך מקום גם לשולחן."}], "bagrut": {"sugya": "סוגיה 4 בתוכנית: סוכה קטנה וגדולה (ג ע״א)", "real": true, "exam": {"code": "006281", "name": "תלמוד, מסכת סוכה", "year": "קיץ תשע״ח (2018)", "q": "שאלה 6", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628178.pdf"}, "key": {"label": "דגם התשובות הרשמי של משרד החינוך, קיץ תשע״ח", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/17.6-d-006281-06-18.pdf"}, "text": "״מי שהיה ראשו ורובו בסוכה ושולחנו בתוך הבית״\nא. ״מי שהיה ראשו ורובו בסוכה ושולחנו בתוך הבית, בית שמאי פוסלין ובית הלל מכשירין.״\n(1) על פי הגמרא, יש שתי אפשרויות להסביר את המקרה שבמשנה. כתוב את שתי האפשרויות.\n(2) הסבר את הקושי שעולה מן הלשון של משנה זו לפי כל אחת מן האפשרויות. (6 נקודות)\nב. בעלי התוספות מביאים את דעת רב עמרם גאון, שפסק הלכה כבית שמאי. על פי התוספות, הסבר את הקושיה מן הגמרא במסכת ברכות (דף יא ע״א) על פסק זה. (3 נקודות)", "answer": "א. (1) אפשרות א — אדם ישב בפתח של סוכה גדולה ושולחנו היה בתוך הבית. אפשרות ב — אדם ישב בסוכה קטנה שיש בה מקום רק לראשו ורובו אבל לא לשולחנו.\n(2) הקושי באפשרות הראשונה — הלשון ״פוסלין״ ו״מכשירין״ נוגעת לדין של סוכה, אך השאלה היא אם האדם יצא ידי חובה בישיבה באופן זה או לא.\nהקושי באפשרות השנייה — הלשון ״מי שהיה...״ נוגעת לדינו של האדם, אך הדיון צריך להיות בנוגע לשאלה אם צריך שהסוכה תחזיק גם את שולחנו או לא.\nב. מהגמרא במסכת ברכות משמע שהלכה כרבי יוחנן בן החורני, שהיה יושב ראשו ורובו בסוכה ושולחנו בתוך הבית, שלא כדעת בית שמאי, ואם כן קשה על דעת רב עמרם שפסק כבית שמאי. (תוד״ה ״דאמר״)", "answerSource": "key", "more": [{"label": "6284 קיץ תשפ״ד, שאלה 2 (סוכה גדולה וסוכה קטנה, + תשובון)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6284sh.pdf", "key": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6284ans.pdf"}]}, "refs": ["3a:11", "3a:12"], "vilna": {"pages": [{"img": "vilna/Sukkah_3a.jpg", "amud": "3a", "w": 800, "h": 1315, "rects": [[285, 724, 258, 131]], "crop": [255, 694, 328, 191], "more": false}], "open": "ואלא קשיא מי שהיה"}, "min": 1.5}]}, {"id": "suk3b", "daf": "סוכה ג׳ (העשרה)", "book": "Sukkah", "group": "מסכת סוכה · יחידת הגבר 5291 (ניסוי)", "kind": "העשרה (רשות)", "bridge": "אתמול: בית שמאי ובית הלל **בתרתי פליגי**, ו**רבי** דורש סוכה של ארבע על ארבע אמות. יחידת העשרה, מחוץ לאפשרויות הלימוד של 5291: ברייתא על **בית שאין בו ארבע על ארבע אמות**. האם היא כרבי בלבד?", "pretest": [{"q": "חדר קטן של 3×3 אמות. צריך מזוזה?", "options": ["כן", "לא", "רק מדרבנן"], "a": "לא: בית שאין בו ארבע על ארבע אמות פטור ממזוזה, כי אינו נחשב ״בית״."}], "quiz": [{"q": "למה בית קטן פטור ממזוזה ומעקה?", "a": "בתורה כתוב ״בית״, ובפחות מארבע על ארבע אמות אינו בית."}, {"q": "למה הברייתא יכולה להיות גם כחכמים?", "a": "חכמים הקלו רק בסוכה, דירת עראי; בית הוא דירת קבע."}, {"q": "למה מניחים בבית קטן שיתוף ולא עירוב?", "a": "עירוב צריך מקום דירה; שיתוף מסתפק במקום כמו חצר שבמבוי."}, {"q": "למה אין לבית קטן חלק בחצר?", "a": "הוא עומד להיהרס (״למיסתר קאי״), ולכן לא צריך חצר."}], "dinim": ["**בית שאין בו ד׳ על ד׳ אמות**: פטור ממזוזה ומעקה, אינו מטמא בנגעים, אינו נחלט, ואין חוזרים עליו מעורכי המלחמה.", "**אפילו רבנן**: סוכה דירת עראי, בית דירת קבע; בבית קטן ״לא דיירי ביה אינשי״.", "**עירוב**: אין מניחים בו עירובי חצרות, אבל שיתוף מניחים.", "**עיבור עיירות**: גרוע מבורגנין. **חלוקה**: אין לו דין חצר, כי ״למיסתר קאי״.", "**ההמשך בדף (ג ע״ב)**: סוכה גבוהה שממעטים אותה בכרים וכסתות; מחוץ ליחידה."], "reviewFrom": [{"id": "suk3a", "n": 2, "when": "אתמול"}], "credits": "טקסט הגמרא: תלמוד בבלי, נוסח ויקיטקסט, דרך ספריא (CC-BY-SA). הפסוקים: ספריא. הביאור בשקפים בניסוח ובמבנה שלנו, על פי הגמרא עצמה, רש״י ותוספות (מתוך ספריא, נחלת הכלל) וביאור הרב שטיינזלץ לתלמוד הבבלי (מהדורת William Davidson, ספריא, ברישיו eepen": null, "multi": false, "tree": null, "ladder": null, "timeline": null, "summaryTitle": null, "lessons": {"hadran": "sukkah", "kih": "sukah/hebcharts/su-tl-", "yt": "מסכת סוכה"}, "slides": [{"id": "e0", "amud": "", "kind": "הקדמה", "title": "שלב 2: העוסק במצווה פטור מן המצווה", "speakers": [], "text": [], "intro": true, "paras": ["פרק שני של סוכה, **״הישן תחת המטה״**. בשלב הזה בתוכנית 5291 (סוגיות 5–7, כה ע״א – כו ע״א) לומדים **מי פטור מן הסוכה**: **שלוחי מצווה**, **חתן** ובני החופה, וגם **אבל**, שדווקא חייב.", "הכלל שעומד מאחורי הכול: **העוסק במצווה פטור מן המצווה**. מי שעסוק עכשיו במצווה אחת לא צריך לעזוב אותה בשביל מצווה אחרת.", "איך קוראים סוגיה: כל צעד בגמרא נפתח ב**מילת מפתח** שמסמנת מה בא עכשיו: שאלה, קושיה, תירוץ או ראיה. הטבלה מרכזת את מילות המפתח של היחידות הקרובות.", "במצב **שיעור** הנגן עוצר ב״רגע לחשוב״ לפני כל תירוץ או מסקנה. זו ההפסקה הנכונה בין השלבים: קודם להבין את הקושיה עד הסוף, ורק אחר כך לשמוע את התשובה."], "explain": [], "nodes": [{"id": "c1", "type": "source", "label": "הכלל", "text": "העוסק במצווה פטור מן המצווה"}, {"id": "c2", "type": "question", "label": "מילת מפתח", "text": "מסמנת את סוג הצעד הבא"}, {"id": "c3", "type": "kushya", "label": "קושיה", "text": "סתירה או קושי בדברים"}, {"id": "c4", "type": "answer", "label": "תירוץ", "text": "מיישב את הקושיה, אחרי ״רגע לחשוב״"}], "verses": [], "widgets": [{"type": "views", "title": "מילות מפתח בסוגיות 5–7", "cols": ["מילת מפתח", "מה היא מסמנת", "איפה"], "views": [{"name": "", "rows": [["מנא הני מילי", "שאלה: מה המקור לדין?", "כה ע״א"], ["מאי משמע", "שאלה: איך זה נלמד מהפסוק?", "כה ע״א"], ["אי הכי / אלא מעתה", "קושיה: אם כך, יוצאת תוצאה קשה", "כה ע״א"], ["וכי תימא... והאמר", "סוגרים תשובה אפשרית מראש", "כה ע״א"], ["מהכא נפקא? מהתם נפקא!", "קושיה: יש לדין מקור אחר", "כה ע״א"], ["צריכא", "תירוץ: צריך את שני המקורות", "כה ע״ב"], ["גופא", "חוזרים לדברים שצוטטו, לגופם", "כה ע״ב"], ["פשיטא / מהו דתימא / קמ״ל", "למה צריך לומר דבר פשוט?", "כה ע״ב"], ["מאי בינייהו / איכא בינייהו", "מה ההבדל המעשי בי היכא דטריד ה\"נ דפטור אלא מעתה טבעה ספינתו בים דטריד הכי נמי דפטור} {k3|וכי תימא ה\"נ והאמר ר' אבא בר זבדא אמר רב אבל חייב בכל המצות האמורות בתורה חוץ מן התפילין שהרי נאמר בהן פאר}"], ["25a:10", "{a2|הכא טריד טירדא דמצוה התם טריד טירדא דרשות}"]], "explain": [["k1", "**אי הכי**: אם החתן פטור כי הוא עוסק במצווה, גם **הכונס אלמנה** מקיים מצווה. למה הוא חייב?"], ["a1", "תירוץ: **הכונס בתולה טרוד**. לפי רש״י, לבו עסוק במחשבה על מצוות הלילה הראשון, ואינו יכול לכוון לשני דברים יחד. **הכונס אלמנה לא טרוד** כך, ויכול לקיים את שתיהן."], ["k2", "קושיה: **וכל היכא דטריד**, כל מי שטרוד פטור? **אלא מעתה**, מי ש**טבעה ספינתו בים** טרוד מאוד. גם הוא פטור מקריאת שמע?"], ["k3", "**וכי תימא**, אם תאמר שכן, הוא פטור: **והאמר רב**, **אבל**, שגם הוא טרוד בצערו, **חייב בכל המצוות** חוץ מ**תפילין**, שנקראות **״פאר״**, ואבל אינו מתפאר."], ["a2", "תירוץ: **הכא**, אצל החתן, **טירדא דמצוה**: הטרדה עצמה היא מצווה. **התם**, באבל ובמי שטבעה ספינתו, **טירדא דרשות**. לפי רש״י, האבל חייב לנהוג מנהגי אבלות, אבל הוא אינו חייב להצטער."]], "nodes": [{"id": "k1", "type": "kushya", "label": "אי הכי", "text": "גם הכונס אלמנה עוסק במצווה"}, {"id": "a1", "type": "answer", "label": "טריד", "to": "k1", "text": "רק הכונס בתולה טרוד"}, {"id": "k2", "type": "kushya", "label": "אלא מעתה", "to": "a1", "text": "גם מי שטבעה ספינתו טרוד: פטור?"}, {"id": "k3", "type": "kushya", "label": "וכי תימא... והאמר", "who": "רב", "to": "k2", "text": "אבל, הטרוד בצערו, חייב בכל המצוות"}, {"id": "a2", "type": "answer", "label": "הכא... התם", "to": "k3", "text": "רק טרדה של מצווה פוטרת"}], "verses": [], "widgets": [{"type": "views", "title": "מי פטור מקריאת שמע?", "cols": ["", "טרוד?", "הטרדה היא מצווה?", "הדין"], "views": [{"name": "", "rows": [["כונס בתולה", "✓", "✓", "פטור"], ["כונס אלמנה", "✗", "—", "חייב"], ["טבעה ספינתו", "✓", "✗", "חייב"], ["אבל", "✓", "✗", "חייב (חוץ מתפילין)"]]}]}], "bottom": "לא הטרדה פוטרת, אלא המצווה שגורמת לה.", "qs": [{"q": "למה הכונס אלמנה חייב בקריאת שמע?", "a": "הוא אינו טרוד כמו הכונס בתולה, ולכן יכול לקיים את שתי המצוות."}, {"q": "איך דין האבל מוכיח שמי שטבעה ספינתו חייב?", "a": "האבל טרוד בצער ובכל זאת חייב בכל המצוות; מכאן שטרדה של רשות אינה פוטרת."}, {"q": "מה מוסיף רש״י על ״טירדא דרשות״ של האבל?", "a": "האבל חייב במנהגי אבלות כדי לכבד את המת, אבל אינו חייב להצטער; הצער שלו הוא רשות."}], "bagrut": {"sugya": "סוגיה 5(א) בתוכנית: משנה ומקור דין העוסק במצווה – מקריאת שמע (כה ע״א)", "real": true, "exam": {"code": "5281", "name": "תורה שבעל פה (מסלול עיון)", "year": "קיץ תשפ״ד (2024)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/5281she.pdf", "q": "שאלה 10"}, "key": null, "text": "הפטורים מקריאת שמע והחייבים בה\nא. (1) על פי ברייתא שהובאה בגמרא, עוסק במצווה וחתן פטורים מקריאת שמע.\nמדוע חתן פטור מקריאת שמע? היעזרו ברש״י.\n(2) הסבירו כיצד הוכיחה הגמרא פטור זה מן המילה ״ובלכתך״. (5 נקודות)\nב. בנוגע לחיוב בקריאת שמע, הגמרא מבדילה בין אדם שטבעה ספינתו בים ובין חתן.\n(1) מדוע היה אפשר לחשוב שהדין שלהם בנוגע לחיוב בקריאת שמע יהיה זהה?\n(2) מדוע בכל זאת יש הבדל ביניהם בנוגע לחיוב בקריאת שמע?\n(3) הסבירו כיצד הוכיחה הגמרא הבדל זה מן הדין שאבל חייב במצוות. (7 נקודות)", "answer": "א. (1) החתן טרוד במחשבות על מצוות הנישואין (רש״י: ״טריד במחשבת בעילה״), ולכן אינו יכול לכוון את לבו לקריאת שמע.\n(2) התורה כתבה ״ובלכתך״ ולא ״ובלכת״: בהליכה שלך, לצורכי רשות, אתה חייב; בהליכה של מצווה אתה פטור. החתן, שטרוד במצווה, נכלל בפטור הזה.\nב. (1) גם מי שטבעה ספינתו טרוד ואינו יכול לכוון, ואם הפטור של החתן הוא בגלל הטרדה, היה מקום לפטור גם אותו.\n(2) טרדת החתן היא טרדה של מצווה, וטרדת מי שטבעה ספינתו היא טרדה של רשות. רק טרדה של מצווה פוטרת.\n(3) רב אמר שאבל, שגם הוא טרוד בצערו, חייב בכל המצוות חוץ מתפילין. מכאן שטרדה שאינה של מצווה אינה פוטרת. (לפי רש״י: האבל חייב בדיני אבלות, אבל אינו חייב להצטער.)", "answerSource": "own", "more": [{"label": "6281 קיץ תשפ״ג, שאלה 2 (שלוחי מצווה; למה צריך לימוד מיוחד לחתן)", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628183k.pdf", "key": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628182kt.pdf"}, {"label": "6281 קיץ תשפ״ד, שאלה 2 (חתן ו״ובלכתך״; תוספות והר״ן)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6281sh.pdf", "key": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/sh6281.pdf"}, {"label": "6284 קיץ תשפ״ד, שאלה 3 (שלוחי מצווה)", "url": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6284sh.pdf", "key": "https://meyda.education.gov.il/files/Pop/0files/toshba-hemed/6284ans.pdf"}]}, "refs": ["25a:8", "25a:9", "25a:10"], "vilna": {"pages": [{"img": "vilna/Sukkah_25a.jpg", "amud": "25a", "w": 800, "h": 1315, "rects": [[304, 517, 224, 131]], "crop": [274, 487, 294, 191], "more": false}], "open": "אי הכי אפילו כונס את האלמנה"}, "min": 1.75}]}, {"id": "suk25b", "daf": "סוכה כ״ה א–ב", "book": "Sukkah", "group": "מסכת סוכה · 5291 שלב 2 (ניסוי)", "kind": "סוגיות 5ב–6", "bridge": "אתמול למדנו את הכלל **העוסק במצווה פטור מן המצווה** מקריאת שמע. היום: **מהכא נפקא? מהתם נפקא!** יש לו מקור נוסף, **הטמאים בפסח מדבר**, ולכן **צריכא**. ואחר כך **אבל**: חייב בכל המצוות, וגם בסוכה.", "pretest": [{"q": "אנשים נטמאו בטיפול במת שבוע לפני פסח, ולכן לא יכלו להקריב. האם עשו נכון?", "options": ["כן, עסקו במצווה", "לא, פסח חמור יותר", "הגמרא לא מכריעה"], "a": "כן: מכאן לומדים שהעוסק במצווה פטור מן המצווה, גם כשהמצווה האחרת חמורה."}, {"q": "אבל ביום הראשון לאבלותו. ממה הוא פטור?", "options": ["מכל המצוות", "מתפילין בלבד", "מסוכה"], "a": "מתפילין בלבד, שנקראות ״פאר״. בשאר המצוות, גם בסוכה, הוא חייב."}], "quiz": [{"q": "למה רבי יצחק דוחה את הזיהויים של רבי יוסי הגלילי ורבי עקיבא?", "a": "בשני המקרים היה להם זמן להיטהר לפני הפסח."}, {"q": "למה צריך גם את המקור מקריאת שמע?", "a": "בקריאת שמע זמן החיוב כבר הגיע, ובפסח עוד לא."}, {"q": "למה צריך גם את המקור מפסח?", "a": "בפסח יש כרת, ובקריאת שמע אין."}, {"q": "למה אבל פטור דווקא מתפילין?", "a": "הן נקראות ״פאר״, ואבל אינו מתפאר."}, {"q": "למה אבל חייב בסוכה אף שמצטער פטור?", "a": "הצער שלו לא בא מהסוכה; עליו ליישב את דעתו."}], "dinim": ["**מהכא נפקא? מהתם נפקא**: הכלל נלמד גם מהטמאים בפסח מדבר.", "**רבי יצחק**: הם עסקו במת מצווה, ו**שביעי שלהן חל בערב פסח**.", "**צריכא**: פסח, לפני זמן החיוב; קריאת שמע, בלי כרת. צריך את שניהם.", "**אבל** חייב בכל המצוות **חוץ מתפילין** (״פאר״), ורק **ביום הראשון**.", "**אבל חייב בסוכה**: מצטער פטור רק ב**צערא דממילא**; האבל צריך **ליתובי דעתיה**."], "reviewFrom": [{"id": "suk25a", "n": 2, "when": "אתמול"}], "credits": "טקסט הגמרא: תלמוד בבלי, נוסח ויקיטקסט, דרך ספריא (CC-BY-SA). הפסוקים: ספריא. הביאור בשקפים בניסוח ובמבנה שלנו, על פי הגמרא עצמה, רש״י ותוספות (מתוך ספריא, נחלת הכלל) וביאור הרב שטיינזלץ לתלמוד הבבלי (מהדורת William Davidson, ספריא, ברישיון CC BY-NC 4.0: https://creativecommons.org/licenses/by-nc/4.0/). דברי שטיינזלץ עובדו ונוסחו מחדש, ואינם מובאים כלשונם; השימוש אינו מסחרי. להבנת הסוגיה נעזרנו גם ב״תלמוד בבלי המבואר – שפה ברורה״ (עוז והדר), ככלי עזר להבנה בלבד ולא כמקור לניסוח. דף הש״ס: וילנא, דרך ספריא. תוכנית הלימודים: משרד החינוך, ״מסכת סוכה תשפ״ז, יחידת ההגבר 5291״ (meyda.education.gov.il), סוגיות 5–7. שאלות הבגרות בשכבת ״שאלת בגרות״: מתוך שאלוני בגרות ודגמי תשובות שפרסם משרד החינוך (©), עם קישור למקור; תשובה המסומנת ״ניסוח עצמי״ נכתבה כאן. גרסת ניסוי פרטית; מכיל קטעי שאלוני בגרות של משרד החינוך (©), להסרה. לפני כל פרסום פומבי יש להחליף את נוסח השאלות האמיתיות בקישורים ובשאלות בניסוח עצמי.", "deepen": null, "multi": true, "tree": null, "ladder": null, "timeline": null, "summaryTitle": null, "lessons": {"hadran": "sukkah", "kih": "sukah/hebcharts/su-tl-", "yt": "מסכת סוכה"}, "slides": [{"id": "f1", "amud": "כ״ה ע״א", "kind": "גמרא", "title": "מהכא נפקא? מהתם נפקא: הטמאים בפסח", "speakers": [["רבי יוסי הגלילי", "תנא"], ["רבי עקיבא", "תנא"], ["רבי יצחק", "תנא"]], "text": [["25a:11", "{k|והעוסק במצוה פטור מן המצוה מהכא נפקא מהתם נפקא} {v|דתניא (במדבר ט, ו) ויהי אנשים אשר היו טמאים לנפש אדם וגו'} {q|אותם אנשים מי היו} {y|נושאי ארונו של יוסף היו דברי ר' יוסי הגלילי}"], ["25b:1", "{r|ר\"ע אומר מישאל ואלצפן היו שהיו עוסקין בנדב ואביהוא} {i|ר' יצחק אומר אם נושאי ארונו של יוסף היו כבר היו יכולין ליטהר אם מישאל ואלצפן היו יכולין היו ליטהר}"], ["25b:2", "{a|אלא עוסקין במת מצוה היו שחל שביעי שלהן להיות בערב פסח} {p|שנאמר (במדבר ט, ו) ולא יכלו לעשות הפסח ביום ההוא ביום ההוא אין יכולין לעשות הא למחר יכולין לעשות}"]], "explain": [["k", "קושיה: את הכלל **העוסק במצווה פטור מן המצווה** לומדים **מכאן**, מקריאת שמע? הרי יש לו מקור אחר, **משם**!"], ["v", "הברייתא עוסקת בפסוק על **אנשים שהיו טמאים למת** ולא יכלו להקריב את קרבן הפסח במדבר."], ["q", "**מי היו האנשים האלה?** שלוש תשובות."], ["y", "**רבי יוסי הגלילי**: אלה ש**נשאו את ארון יוסף** ממצרים."], ["r", "**רבי עקיבא**: **מישאל ואלצפן**, שהוציאו את גופות **נדב ואביהוא**."], ["i", "**רבי יצחק** דוחה את שתיהן: בשני המקרים **היה להם זמן להיטהר** לפני הפסח. ארון יוסף נישא חודשים קודם, ונדב ואביהוא מתו בא׳ בניסן (רש״י). והפסוק אומר ״**ולא יכלו**״."], ["a", "**אלא**: הם **עסקו במת מצווה** (לפי רש״י: כל מת שמצווה לטפל בו, גם קרוב), ו**היום השביעי שלהם** חל **בערב פסח**."], ["p", "ההוכחה: **״ביום ההוא״** לא יכלו, אבל **למחר** כבר יכלו. ומכאן הכלל: הם נטמאו במצווה, אף שידעו שזה ימנע מהם את הפסח. לפי רש״י: מצווה קלה שבאה לידך לא נדחית מפני מצווה חמורה שעוד לא הגיעה."]], "nodes": [{"id": "k", "type": "kushya", "label": "מהכא נפקא?", "text": "יש לכלל מקור אחר"}, {"id": "v", "type": "source", "label": "הברייתא", "to": "k", "text": "אנשים טמאים שלא יכלו לעשות פסח"}, {"id": "q", "type": "question", "label": "מי היו", "to": "v", "text": "מי היו האנשים הטמאים?"}, {"id": "y", "type": "source", "label": "ר׳ יוסי הגלילי", "to": "q", "text": "נושאי ארון יוסף"}, {"id": "r", "type": "source", "label": "רבי עקיבא", "to": "q", "text": "מישאל ואלצפן"}, {"id": "i", "type": "rejection", "label": "רבי יצחק", "to": "r", "text": "בשני המקרים יכלו להיטהר"}, {"id": "a", "type": "answer", "label": "אלא", "who": "רבי יצחק", "to": "i", "text": "עסקו במת מצווה; השביעי שלהם בערב פסח"}, {"id": "p", "type": "proof", "label": "ביום ההוא", "to": "a", "text": "היום לא יכלו, למחר כן"}], "verses": [{"ref": "Numbers.9.6", "he": "במדבר ט, ו", "text": "וַיְהִי אֲנָשִׁים אֲשֶׁר הָיוּ טְמֵאִים לְנֶפֶשׁ אָדָם וְלֹא־יָכְלוּ לַעֲשֹׂת־הַפֶּסַח בַּיּוֹם הַהוּא וַיִּקְרְבוּ לִפְנֵי מֹשֶׁה וְלִפְנֵי אַהֲרֹן בַּיּוֹם הַהוּא", "keys": ["וַיְהִי אֲנָשִׁים אֲשֶׁר הָיוּ טְמֵאִים לְנֶפֶשׁ אָדָם", "וְלֹא־יָכְלוּ לַעֲשֹׂת־הַפֶּסַח בַּיּוֹם הַהוּא"], "node": "v", "auto": true}], "widgets": [{"type": "timeline", "title": "מתי נטמאו? (ניסן, שנה שנייה ליציאת מצרים)", "axis": ["א׳ ניסן", "", "", "", "", "", "", "ח׳", "", "", "", "", "", "י״ד", ""], "views": [{"name": "רבי יוסי הגלילי", "points": [{"at": -3, "who": "ארון יוסף", "label": "חודשים קודם", "fuzzy": true}, {"at": 13, "who": "ערב פסח", "label": "כבר טהורים", "clash": true}]}, {"name": "רבי עקיבא", "points": [{"at": 0, "who": "נדב ואביהוא", "label": "נטמאו בהם"}, {"at": 1, "who": "נשרפה הפרה", "label": "רש״י", "kind": "start"}, {"at": 7, "who": "עברו 7 ימים", "label": "טהורים"}, {"at": 13, "who": "ערב פסח", "label": "כבר טהורים", "clash": true}]}, {"name": "רבי יצחק", "points": [{"at": 7, "who": "נטמאו במת", "label": "יום ראשון"}, {"at": 13, "who": "ערב פסח", "label": "יום שביעי", "kind": "end"}, {"at": 14, "who": "למחר", "label": "טהורים"}]}], "note": "לפי רש״י: ארון יוסף נישא לאחרונה יותר מעשרה חודשים קודם (מחוץ לציר, בהערכה); המשכן הוקם בא׳ בניסן, ובו מתו נדב ואביהוא; ב־ב׳ בניסן נשרפה הפרה האדומה. טומאת מת נמשכת שבעה ימים."}], "bottom": "הם בחרו בטומאה של מצווה, אף שידעו שתעלה להם בקרבן פסח.", "qs": [{"q": "מה הקושיה ״מהכא נפקא? מהתם נפקא״?", "a": "למה ללמוד את הכלל מקריאת שמע, אם הוא כבר נלמד מהטמאים בפסח מדבר?"}, {"q": "למה רבי יצחק דוחה את רבי יוסי הגלילי ואת רבי עקיבא?", "a": "בשני המקרים עבר מספיק זמן כדי להיטהר לפני הפסח, והפסוק אומר ״ולא יכלו״."}, {"q": "איך לומדים מהם שהעוסק במצווה פטור מן המצווה?", "a": "הם נטמאו למת מצווה אף שידעו שהטומאה תמנע מהם את קרבן הפסח."}], "refs": ["25a:11", "25b:1", "25b:2"], "vilna": {"pages": [{"img": "vilna/Sukkah_25a.jpg", "amud": "25a", "w": 800, "h": 1315, "rects": [[304, 649, 224, 82]], "crop": [274, 619, 294, 142], "more": false}, {"img": "vilna/Sukkah_25b.jpg", "amud": "25b", "w": 800, "h": 1315, "rects": [[262, 167, 238, 131]], "crop": [232, 137, 308, 191], "more": false}], "open": "והעוסק במצוה פטור מן המצוה מהכא נפקא"}, "min": 2}, {"id": "f2", "amud": "כ״ה ע״ב", "kind": "גמרא", "title": "צריכא: למה צריך שני מקורות", "speakers": [], "text": [["25b:3", "{t|צריכא} {a1|דאי אשמעינן התם משום דלא מטא זמן חיובא דפסח אבל הכא דמטא זמן ק\"ש אימא לא צריכא} {a2|ואי אשמעי' הכא משום דליכא כרת אבל התם דאיכא כרת אימא לא צריכא}"]], "explain": [["t", "**צריכא**: התירוץ לקושיה ״מהכא נפקא״. צריך את שני המקורות, כי מכל אחד לבד היינו טועים."], ["a1", "אילו למדנו רק **מהטמאים בפסח**: שם, כשנטמאו, **עוד לא הגיע זמן הפסח** (רש״י). אבל **בקריאת שמע**, זמן החיוב **כבר הגיע** בזמן החופה. שם היינו אומרים שהחתן חייב."], ["a2", "ואילו למדנו רק **מקריאת שמע**: שם **אין כרת**. אבל **בפסח** יש **כרת** למי שלא הקריב. שם היינו אומרים שאסור להיטמא."]], "nodes": [{"id": "t", "type": "answer", "label": "צריכא", "text": "צריך את שני המקורות"}, {"id": "a1", "type": "proof", "label": "רק מפסח?", "to": "t", "text": "שם זמן החיוב עוד לא הגיע"}, {"id": "a2", "type": "proof", "label": "רק מק״ש?", "to": "t", "text": "שם אין עונש כרת"}], "verses": [], "widgets": [{"type": "views", "title": "מה ייחודי בכל מקור", "cols": ["", "זמן החיוב כבר הגיע?", "עונש כרת?"], "views": [{"name": "", "rows": [["קריאת שמע (חתן)", "✓", "✗"], ["קרבן פסח (הטמאים)", "✗", "✓"]]}], "note": "כל מקור מלמד את הכלל במקרה שהשני לא מכסה."}], "bottom": "כל מקור סוגר פרצה שהמקור השני משאיר פתוחה.", "qs": [{"q": "מה היינו אומרים אילו היה לנו רק המקור מפסח?", "a": "שהפטור הוא רק כשזמן המצווה השנייה עוד לא הגיע; בקריאת שמע, שזמנה הגיע, החתן היה חייב."}, {"q": "מה היינו אומרים אילו היה לנו רק המקור מקריאת שמע?", "a": "שהפטור הוא רק במצווה בלי כרת; בפסח, שיש בו כרת, היה אסור להיטמא."}], "bagrut": {"sugya": "סוגיה 5(ב) בתוכנית: מקור דין העוסק במצווה – טמאי מת בפסח מדבר (כה ע״א – כה ע״ב)", "real": true, "exam": {"code": "006281", "name": "תלמוד, מסכת סוכה", "year": "קיץ תשע״ח (2018)", "q": "שאלה 1", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/628178.pdf"}, "key": {"label": "דגם התשובות הרשמי של משרד החינוך, קיץ תשע״ח", "url": "https://meyda.education.gov.il/files/mazkirut_pedagogit/toshbammd/17.6-d-006281-06-18.pdf"}, "text": "העוסק במצווה והולכי דרכים\nא. ״העוסק במצווה פטור מן המצווה״ — הלכה זו נלמדה בגמרא משני פסוקים שונים.\nבחר באחד מן הפסוקים שממנו למדה הגמרא הלכה זו, והסבר את הלימוד מן הפסוק שבחרת. (2 נקודות)\nב. עיין בדברי הרב אשר וייס שלפניך, וענה על השאלות שאחריהם.\n״... נראה דלא נחלקו התוספות והר״ן בשורש הלכה זו ומהות גדרה אלא בפרטיה ודקדוקיה. וביאור מחלוקתם נראה לכאורה דיסוד גדר הלכה זו היא כעין ביזוי מצווה הוא, דאין זה כבוד למצווה להניחה ולקיים אחרת. ואף שעוסק במצווה הוא ולא בצורכי עצמו, מכל מקום אין זה דרך כבוד לדלג ממצווה למצווה, וכעין הלכתא דאין מעבירין על המצוות. ונחלקו הראשונים בכך, דלדעת התוספות אין פגם אלא במניח מצווה זו כדי לקיים אחרת, אבל במקיים שתיהן אין כל פגם וביזיון. ולדעת הר״ן אף ביכול לקיים שתיהן אין ראוי לעוסק במצווה לעסוק באחרת, אלא יש לרכז כל פועלו ומחשבתו לקיום המצווה שהוא עוסק בה.״ (הרב אשר וייס, מנחת אשר, דברים, עמ׳ סח–ע)\n(1) על פי הרב אשר וייס, הסבר את טעם ההלכה ״העוסק במצווה פטור מן המצווה״.\n(2) על פי הרב אשר וייס, הסבר את המחלוקת בין בעלי התוספות לר״ן. (5 נקודות)\nג. עיין בדברי הרב יעקב אריאל שלפניך, וענה על השאלות שאחריהם.\n״הרב משה פיינשטיין באגרות משה (אורח חיים, חלק ג׳, סימן צ״ג) הבחין בין טיולים לבין יציאה למסחר בחול המועד, שמסחר הוא צורך ואילו טיולים אינם לצורך אלא רק לתענוג, ולכן אסור לדעתו לצאת לטיול בחול המועד סוכות ללא סוכה. ולעניות דעתי יש לחלק בין חוץ לארץ לארץ־ישראל כפי שיבואר. והנה למרות מה שכתבנו שראוי להימנע מלצאת לטיול בסוכות במקום שאין סוכה, יש גם מקום ללמד זכות על המטיילים בסוכות ונאלצים לאכול מחוץ לסוכה. כי לציבור הדתי אין הרבה הזדמנויות לטייל בארץ. בימות החול — עסוקים, בשבת אסור לנסוע ולטייל. נשאר בעיקר חול המועד שהוא הזמן הטוב ביותר לטייל בארץ, והרי יש מצווה לטייל ד׳ אמות בארץ־ישראל, ובפרט לבני נוער שהטיול מחבב עליהם את הארץ.״ (הרב יעקב אריאל, שו״ת באהלה של תורה, חלק ב׳, סימן צ״ג)\n(1) על פי הרב משה פיינשטיין (שדבריו הובאו בתשובת הרב יעקב אריאל), אסור לצאת לטיול בחול המועד סוכות בלי סוכה, אך מותר לצאת למטרת מסחר בחול המועד סוכות בלי סוכה. הסבר את הטעם להבדל בין הדינים.\n(2) הרב יעקב אריאל הִבדיל בין שני סוגי טיולים: האחד שבו מותר לטייל בלי סוכה, והאחר שבו אסור לטייל בלי סוכה. כתוב באיזה טיול מותר לטייל בלי סוכה ובאיזה טיול אסור לטייל בלי סוכה, והסבר את הטעם להבדל זה. (5 נקודות)", "answer": "א. הלימוד מן הפסוק הראשון — אם אתה עסוק בישיבה שלך (״בשבתך״), כלומר בענייני רשות שלך, אתה עדיין חייב במצווה, אבל אם אתה עסוק בישיבה של מצווה, אתה פטור מן המצווה.\nהלימוד מן הפסוק השני — האנשים שהיו טמאים לנפש אדם ולא יכלו לעשות את הפסח נטמאו למת שבעה ימים לפני פסח אף שטומאה זו תמנע מהם לאכול מקורבן הפסח. משמע ש״מצווה קלה״ של קבורת מת דוחה מצווה חמורה של קורבן פסח כי העוסק במצווה פטור מן המצווה.\n[הערה למעריך: די בהסבר הלימוד מפסוק אחד] (דף כה, ע״א–ע״ב)\nב. (1) עזיבת מצווה אחת כדי לקיים מצווה אחרת היא כעין ביזוי למצווה שאדם עוזב.\n(2) לדעת בעלי התוספות, ביזוי מצווה הוא רק כאשר אדם עוזב מצווה אחת לגמרי, אבל אם הוא מקיים את שתי המצוות בסופו של דבר ורק דוחה את קיום אחת המצוות, אין זה ביזוי למצווה, ולכן במקרה זה העוסק במצווה אינו פטור מן המצווה.\nלדעת הר״ן, עצם העובדה שאדם עוזב מצווה אחת הרי זה ביזוי למצווה זו, אף אם יקיים את שתיהן בסופו של דבר, ולכן גם במקרה זה העוסק במצווה פטור מן המצווה.\nג. (1) יציאה למטרת מסחר היא צורך, ואילו טיול הוא רק לתענוג.\n(2) מותר לצאת לטיול בארץ בלי סוכה, ואסור לצאת לטיול בחוץ לארץ בלי סוכה.\nטעם ההבדל הוא כי יש מצווה לטייל ארבע אמות בארץ־ישראל.", "answerSource": "key", "more": []}, "refs": ["25b:3"], "vilna": {"pages": [{"img": "vilna/Sukkah_25b.jpg", "amud": "25b", "w": 800, "h": 1315, "rects": [[262, 300, 238, 81]], "crop": [232, 270, 308, 141], "more": false}], "open": "צריכא דאי אשמעינן התם"}, "min": 1.25}, {"id": "f3", "amud": "כ״ה ע״ב", "kind": "גמרא", "title": "אבל: חייב בכל המצוות חוץ מתפילין", "speakers": [["רבי אבא בר זבדא", "אמורא"], ["רב", "אמורא בבל"]], "text": [["25b:4", "{g|ג   DI = Math.max(0, Math.min(LIB.library.length-1, k)); DATA = LIB.library[DI]; S = DATA.slides; N = S.length;
  st.i = -1; st.step = 0;
  st.times = store.get(dk("times"), null); if(!st.times || st.times.length!==N+2) st.times = new Array(N+2).fill(0);
  st.reviewed = new Set(store.get(dk("reviewed"), []));
  st.quiz = store.get(dk("quiz"), {}); st.pre = store.get(dk("pre"), {}); st.rev = store.get(dk("rev"), {});
  st.revItems = buildReview();
  store.set("daf", DATA.id);
  $("#dafName").textContent = DATA.daf;
  const sel = $("#dafSel"); if(sel) sel.value = String(DI);
}
// Spaced retrieval: questions from yesterday's daf and from a week ago. Questions missed before come first.
function pickFrom(src, n){
  const res = store.get(dk("quiz", src.id), {});
  const order = src.quiz.map((q,k)=>k).sort((a,b)=>{ const p=v=>v==="no"?0:v==null?1:2; return p(res[a])-p(res[b]) || a-b; });
  return order.slice(0,n).map(k=>({daf:src, k, q:src.quiz[k], last:res[k]}));
}
function buildReview(){
  const items=[];
  (DATA.reviewFrom||[]).forEach(r=>{ const src=LIB.library.find(d=>d.id===r.id); if(src) items.push(...pickFrom(src, r.n).map(x=>({...x, when:r.when}))); });
  return items;
}
const PAUSE = {answer:"עצרו רגע: איך הגמרא תענה על זה?", rejection:"עצרו רגע: מה הבעיה בהצעה הזו?", conclusion:"עצרו רגע: מה המסקנה?", drasha:"עצרו רגע: מה אפשר לדרוש מכאן?"};
function buildSeq(s){ const q=[]; s.nodes.forEach(n=>{ if(PAUSE[n.type] && n.to) q.push({pause:n.id, type:n.type}); q.push({node:n.id}); }); return q; }
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const fmt = sec => { sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); };
const sefaria = ref => { const [d,l]=ref.split(":"); return `https://www.sefaria.org/${DATA.book}.${d}.${l}?lang=he&with=Steinsaltz`; };
const sefariaVerse = ref => `https://www.sefaria.org/${ref}?lang=he`;
function gem(n){ const u=["","א","ב","ג","ד","ה","ו","ז","ח","ט"], te=["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
  let s = n===15?"טו":n===16?"טז":te[Math.floor(n/10)]+u[n%10];
  return s.length>1 ? s.slice(0,-1)+"״"+s.slice(-1) : s+"׳"; }
function refLabel(r){ const [d,l]=r.split(":"), amud=/a$/.test(d)?"ע״א":"ע״ב";
  return (DATA.multi ? gem(parseInt(d))+" " : "")+amud+" "+l; }

function depthMap(nodes){
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n])), d={};
  const f=(n,g=0)=>{ if(d[n.id]!=null) return d[n.id]; if(!n.to||g>6) return d[n.id]=0; return d[n.id]=Math.min(3,f(byId[n.to],g+1)+1); };
  nodes.forEach(n=>f(n)); return d;
}
const CITE_RE = /\((בראשית|שמות|ויקרא|במדבר|דברים|יהושע|שופטים|ישעיהו|ישעיה|ירמיהו|ירמיה|יחזקאל|הושע|יואל|עמוס|עובדיה|יונה|מיכה|נחום|חבקוק|צפניה|חגי|זכריה|מלאכי|תהלים|תהילים|משלי|איוב|רות|איכה|קהלת|אסתר|דניאל|עזרא|נחמיה)\s[^()]{1,14}\)/g;
function renderGemara(t, typeOf, revealed){
  return esc(t).replace(CITE_RE, m=>`<span class="cite" title="הפסוק המלא מופיע מתחת לטקסט">${m}</span>`).replace(/\{(\w+)\|([^}]*)\}/g,(m,id,txt)=>{
    const ty=typeOf[id]; const hid = revealed && !revealed.has(id) ? " hidden-step" : "";
    return `<span data-n="${id}" class="${hid}" style="--c:var(${TYPES[ty].c})">${txt}</span>`;
  });
}
