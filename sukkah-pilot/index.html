function renderGeo(g){
  const [s,n,w,e]=g.bbox, c=Math.cos((s+n)/2*Math.PI/180), MW=g.mapW||270, k=MW/((e-w)*c), MH=(n-s)*k;
  const L=g.padX||95, T=8, VW=MW+2*L, VH=MH+T+8, cid="gc"+Math.random().toString(36).slice(2,7);
  const P=([la,lo])=>[L+(lo-w)*c*k, T+(n-la)*k], f=v=>v.toFixed(1);
  const pts=a=>a.map(p=>P(p).map(f).join(",")).join(" ");
  const halo='paint-order="stroke" stroke="var(--surface)" stroke-width="3.5" stroke-linejoin="round"';
  const txt=(x,y,t,o={})=>`<text x="${f(x)}" y="${f(y)}" font-size="${o.size||12}" font-weight="${o.wt||400}" fill="${o.fill||"var(--ink)"}" text-anchor="${o.anchor||"middle"}" direction="rtl" ${o.halo===false?"":halo}${o.it?' font-style="italic"':""}>${esc(t)}</text>`;
  const land=[...GEO_BASE.coast,[35.3,40],[30,40]];
  let o=`<svg viewBox="0 0 ${f(VW)} ${f(VH)}" role="img" aria-label="${esc(g.title||"מפה סכמטית")}"><defs><clipPath id="${cid}"><rect x="${L}" y="${T}" width="${f(MW)}" height="${f(MH)}" rx="6"/></clipPath></defs>`;
  o+=`<g clip-path="url(#${cid})"><rect x="${L}" y="${T}" width="${f(MW)}" height="${f(MH)}" fill="color-mix(in srgb,var(--t-proof) 13%,var(--surface))"/>`;
  o+=`<polygon points="${pts(land)}" fill="var(--surface)" stroke="var(--muted)" stroke-width="0.9" stroke-linejoin="round"/>`;
  o+=`<polyline points="${pts(GEO_BASE.jordan)}" fill="none" stroke="var(--t-proof)" stroke-width="1.8" stroke-linejoin="round"/>`;
  if(g.jordanHL){ const seg=GEO_BASE.jordan.filter(p=>p[0]<=g.jordanHL.lat); seg.unshift([g.jordanHL.lat, 35.545]);
    o+=`<polyline points="${pts(seg)}" fill="none" stroke="var(--t-conclusion)" stroke-width="5" stroke-linecap="round" opacity=".85"/>`; }
  GEO_BASE.lakes.forEach(l=>{ o+=`<polygon points="${pts(l)}" fill="color-mix(in srgb,var(--t-proof) 13%,var(--surface))" stroke="var(--t-proof)" stroke-width="1.2"/>`; });
  (g.areas||[]).forEach(a=>{ const [x,y]=P([a.lat,a.lon]); o+=txt(x,y,a.t,{size:11,fill:"var(--muted)",it:true,halo:false}); });
  o+=`</g><rect x="${L}" y="${T}" width="${f(MW)}" height="${f(MH)}" rx="6" fill="none" stroke="var(--line)"/>`;
  if(g.jordanHL){ const [x,y]=P([g.jordanHL.lat-0.05,35.56]); o+=`<line x1="${f(x+4)}" y1="${f(y)}" x2="${f(L+MW+6)}" y2="${f(y)}" stroke="var(--muted)" stroke-width=".7"/>`+txt(L+MW+8,y,g.jordanHL.label,{size:12,wt:700,fill:"var(--t-conclusion)",anchor:"end"})+(g.jordanHL.sub?txt(L+MW+8,y+13,g.jordanHL.sub,{size:10,fill:"var(--t-conclusion)",anchor:"end"}):""); }
  (g.refs||[]).forEach(r=>{ const [x,y]=P([r.lat,r.lon]); o+=`<rect x="${f(x-2.5)}" y="${f(y-2.5)}" width="5" height="5" fill="none" stroke="var(--muted)" stroke-width="1.2"/>`+txt(r.side==="r"?x+7:x-7,y+4,r.t,{size:10.5,fill:"var(--muted)",anchor:r.side==="r"?"end":"start"}); });
  (g.places||[]).forEach(p=>{ const [x,y]=P([p.lat,p.lon]), r=p.side==="r", dx=p.dx||0, dy=p.dy||0;
    const lx = r ? Math.max(x+10, L+MW+6)+dx : Math.min(x-10, L-6)+dx, ly=y+dy;
    let mk = `<circle class="hl" cx="${f(x)}" cy="${f(y)}" r="13" fill="var(--sch)"/>`;
    if(p.sure==="approx") mk+=`<circle cx="${f(x)}" cy="${f(y)}" r="8" fill="none" stroke="var(--sch)" stroke-width="1.6" stroke-dasharray="2.5 2"/><circle cx="${f(x)}" cy="${f(y)}" r="2" fill="var(--sch)"/>`;
    else if(p.sure==="res") mk+=`<circle cx="${f(x)}" cy="${f(y)}" r="7" fill="none" stroke="var(--sch)" stroke-width="1.5"/><circle cx="${f(x)}" cy="${f(y)}" r="3.6" fill="var(--sch)"/>`;
    else mk+=`<circle cx="${f(x)}" cy="${f(y)}" r="4.6" fill="var(--sch)" stroke="var(--surface)" stroke-width="1.2"/>`;
    o+=`<g class="gp" data-n="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}">${mk}<line x1="${f(r?x+7:x-7)}" y1="${f(y)}" x2="${f(r?lx-2:lx+2)}" y2="${f(ly)}" stroke="var(--muted)" stroke-width=".7"/>`
      + txt(lx, ly+(p.sub?0:4), p.name, {size:12.5, wt:700, anchor:r?"end":"start"})
      + (p.sub? txt(lx, ly+13, p.sub, {size:10, fill:"var(--muted)", anchor:r?"end":"start"}) : "") + `</g>`; });
  const km=g.scaleKm||20, sx=L+10, sy=T+MH-12, sl=km/111*k;
  o+=`<line x1="${f(sx)}" y1="${f(sy)}" x2="${f(sx+sl)}" y2="${f(sy)}" stroke="var(--ink)" stroke-width="2"/>`+txt(sx+sl/2,sy-5,`${km} ק״מ`,{size:10});
  o+=txt(L+20,T+16,"צפון ↑",{size:10,fill:"var(--muted)"});
  o+=`</svg>`;
  const leg=[["sure",'<circle cx="8" cy="8" r="4.6" fill="var(--sch)"/>',"זיהוי ודאי או לפי שטיינזלץ"],["res",'<circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--sch)" stroke-width="1.5"/><circle cx="8" cy="8" r="3.4" fill="var(--sch)"/>',"זיהוי לפי המחקר"],["approx",'<circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--sch)" stroke-width="1.5" stroke-dasharray="2.5 2"/>',"מיקום משוער"]]
    .filter(([t])=>(g.places||[]).some(p=>(p.sure||"sure")===t));
  if(g.refs&&g.refs.length) leg.push(["ref",'<rect x="5" y="5" width="6" height="6" fill="none" stroke="var(--muted)" stroke-width="1.2"/>',"להתמצאות (לא בדף)"]);
  return `<div class="geo">${o}<div class="geo-leg">${leg.map(([,i,t])=>`<span><svg viewBox="0 0 16 16">${i}</svg>${esc(t)}</span>`).join("")}</div>`
    + (g.unplaced&&g.unplaced.length?`<div class="geo-un">לא מסומנים במפה: ${g.unplaced.map(u=>`<b>${esc(u.name)}</b> <span>(${esc(u.note)})</span>`).join(" · ")}</div>`:"")
    + (g.note?`<div class="wnote">${esc(g.note)}</div>`:"") + `</div>`;
}

function renderSlide(){
  const s=S[st.i], typeOf=Object.fromEntries(s.nodes.map(n=>[n.id,n.type]));
  const lesson = st.mode==="lesson";
  const order = s.nodes.map(n=>n.id);
  const seq = buildSeq(s), done = seq.slice(0,st.step);
  const revealed = lesson ? new Set(done.filter(x=>x.node).map(x=>x.node)) : null;
  const pauseOn = lesson && done.length && done[done.length-1].pause ? done[done.length-1] : null;
  const d=depthMap(s.nodes), byId=Object.fromEntries(s.nodes.map(n=>[n.id,n]));
  const usedTypes=[...new Set(s.nodes.map(n=>n.type))];
  const refs=s.refs;
  $("#stage").innerHTML = `
    <div class="head">
      <div>
        <div class="eyebrow">${esc(DATA.daf)}${s.amud?" "+esc(s.amud):""} · ${esc(s.kind)} · שקף ${st.i+1} מתוך ${N}</div>
        <h1>${esc(s.title)}</h1>
        <div class="speakers">${s.speakers.map(([n,e])=>`<span class="spk">${esc(n)}<small>${esc(e)}</small></span>`).join("")}</div>
      </div>
      <div class="head-actions">
        ${refs.length?`<a href="${sefaria(refs[0])}" target="_blank" rel="noopener">בספריא עם שטיינזלץ ↗</a>`:""}
        ${DATA.deepen?`<a href="${DATA.deepen}" target="_blank" rel="noopener">להעמיק ↗</a>`:""}
        <button class="chip-btn" id="rev" aria-pressed="${st.reviewed.has(s.id)}">${st.reviewed.has(s.id)?"✓ נבדק":"סמן כנבדק"}</button>
      </div>
    </div>
    ${s.check?`<div class="check"><b>לבדיקה:</b><span>${esc(s.check)}</span></div>`:""}
    ${DATA.tree?renderTree(st.i,true):""}
    <div class="cols" id="cols">
      <section class="panel">
        <h2 class="panel-title">${s.geo?"מפה סכמטית":s.intro?"רקע":"הטקסט"}</h2>
        ${s.geo?renderGeo(s.geo):""}
        ${s.vilna?renderVilna(s.vilna):""}
        ${s.intro?`<div class="paras">${s.paras.map(p=>`<p>${bold(p)}</p>`).join("")}</div>`:""}
        <div class="gemara">${s.text.map(([r,t])=>`<div class="seg-row"><span class="ref">${esc(refLabel(r))}</span><p class="gtext">${renderGemara(t,typeOf,revealed)}</p></div>`).join("")}</div>
        ${s.verses&&s.verses.length?`<div class="verses"><h2 class="panel-title">${s.verses.length>1?"הפסוקים במלואם":"הפסוק במלואו"}</h2>${s.verses.map(v=>renderVerse(v,typeOf,s.numbered,revealed)).join("")}</div>`:""}
        <div class="explain" ${st.explain&&s.explain.length?"":"hidden"}>
          <h2 class="panel-title">ביאור</h2>
          ${s.explain.map(([n,t])=>`<p data-n="${n}" style="--c:var(${TYPES[typeOf[n]].c})" ${revealed&&!revealed.has(n)?"hidden":""}>${bold(t)}</p>`).join("")}
        </div>
      </section>
      <section class="panel">
        ${DATA.timeline && DATA.timeline.show.includes(st.i) ? renderUnitTimeline(st.i) : ""}
        <h2 class="panel-title">${s.geo?"המקומות":s.intro?"מושגים":"המהלך"}</h2>
        <div class="legend">${usedTypes.map(t=>`<span style="--c:var(${TYPES[t].c})"><i></i>${TYPES[t].name}</span>`).join("")}</div>
        <div class="flow">${s.nodes.map(n=>{
          if(pauseOn && pauseOn.pause===n.id) return `<div class="node pause" style="--d:${d[n.id]};--c:var(${TYPES[n.type].c})" data-d="${d[n.id]}"><div class="top"><span class="pill">רגע לחשוב</span></div><div class="txt">${PAUSE[n.type]}</div></div>`;
          const pend = revealed && !revealed.has(n.id);
          const onto = n.to && byId[n.to] && n.to!==order[order.indexOf(n.id)-1] ? `<span class="onto">← על: ${esc(byId[n.to].label)}</span>` : "";
          return `<div class="node${pend?" pending":""}" data-n="${n.id}" data-d="${d[n.id]}" style="--d:${d[n.id]};--c:var(${TYPES[n.type].c})" tabindex="${pend?-1:0}" role="button" aria-label="${esc(n.label)}">
            <div class="top"><span class="pill">${esc(n.label)}</span>${n.who?`<span class="who">${esc(n.who)}</span>`:""}${onto}</div>
            <div class="txt">${esc(n.text)}</div></div>`;}).join("")}</div>
        ${(s.widgets||[]).map(renderWidget).join("")}
      </section>
    </div>
    <div class="bottomline" ${lesson&&st.step<seq.length?"hidden":""}><span class="lbl">בשורה התחתונה</span><p>${esc(s.bottom)}</p></div>
    ${s.discuss?`<div class="discuss" ${lesson&&st.step<seq.length?"hidden":""}><span class="lbl">שאלה לחברותא</span><p>${esc(s.discuss)}</p></div>`:""}
    ${renderDeep(s, lesson&&st.step<seq.length)}`;
  wireWidgets();
  wireSlide(s);
  wireDeep(s);
  const lastNode = lesson ? [...done].reverse().find(x=>x.node) : null;
  if(lastNode && !pauseOn) setActive(lastNode.node, false);
}

function renderVerse(v, typeOf, numbered, revealed){
  const c = TYPES[typeOf[v.node]||"verse"].c, hide = revealed && v.node && !revealed.has(v.node);
  let html="", cur=0, k=0;
  const spots=[]; v.keys.forEach((key,i)=>{ let p=v.text.indexOf(key,cur); if(p<0) p=v.text.indexOf(key); if(p>=0){ spots.push([p,p+key.length,i]); cur=p+key.length; } });
  spots.sort((a,b)=>a[0]-b[0]); cur=0;
  spots.forEach(([a,b,i])=>{ if(a<cur) return; html+=esc(v.text.slice(cur,a))+`<mark class="vk">${numbered?`<sup>${i+1}</sup>`:""}${esc(v.text.slice(a,b))}</mark>`; cur=b; });
  html+=esc(v.text.slice(cur));
  return `<div class="verse${hide?" vhide":""}" ${v.node?`data-n="${v.node}"`:""} style="--c:var(${c})">
    <div class="vhead"><span>${esc(v.he)}</span><a href="${sefariaVerse(v.ref)}" target="_blank" rel="noopener">בספריא ↗</a></div>
    <p class="vtext">${html}</p></div>`;
}

function renderTree(cur, compact){
  const items = DATA.tree.map((t,k)=>`<li class="tr${t.side?" side":""}${t.slide===cur?" cur":""}${cur!=null&&t.slide<cur?" past":""}" style="--d:${t.d}"><button data-s="${t.slide}">${t.side?`<span class="tag">צד</span>`:""}${esc(t.label)}</button></li>`).join("");
  return compact ? `<details class="where"><summary>איפה אנחנו בסוגיה</summary><ol class="tree">${items}</ol></details>`
                 : `<ol class="tree">${items}</ol>`;
}

const WIDGET_INIT = [];
function wireWidgets(){ while(WIDGET_INIT.length) WIDGET_INIT.shift()(); document.querySelectorAll(".tree button").forEach(b=>b.onclick=()=>go(+b.dataset.s)); }

function renderTimeline(w, id){
  const all = w.views.flatMap(v=>v.points.map(p=>p.at));
  const lo = Math.min(0, ...all), hi = Math.max(w.axis.length-1, ...all), pct = x => 14 + (x-lo)/(hi-lo||1)*72;
  const view = v => {
    const pts = [...v.points].sort((a,b)=>a.at-b.at), rows=[];
    pts.forEach(p=>{ const x=pct(p.at); let r=0; while(rows[r]!=null && Math.abs(rows[r]-x)<22) r++; rows[r]=x; p._r=r; p._x=x; });
    const nr = Math.max(1, rows.length);
    return `<div class="tl" style="--rows:${nr}">
      <div class="tl-pts">${pts.map(p=>`<div class="tl-pt ${p.kind||""}${p.clash?" clash":""}" style="inset-inline-start:${p._x}%;--r:${p._r}"><b>${esc(p.who)}</b><span>${esc(p.label||"")}${p.clash?" · מתנגש!":""}</span></div>`).join("")}</div>
      <div class="tl-axis">${w.axis.map((a,k)=>`<span class="tl-tick" style="inset-inline-start:${pct(k)}%"><i></i>${esc(a)}</span>`).join("")}</div>
    </div>`;
  };
  WIDGET_INIT.push(()=>{ const root=document.getElementById(id); if(!root) return;
    root.querySelectorAll(".wtabs button").forEach((b,k)=>b.onclick=()=>{ root.querySelectorAll(".wtabs button").forEach(x=>x.setAttribute("aria-pressed",x===b)); root.querySelector(".tl-wrap").innerHTML=view(w.views[k]); }); });
  return `<div class="widget" id="${id}"><h3>${esc(w.title)}</h3>
    ${w.views.length>1?`<div class="wtabs">${w.views.map((v,k)=>`<button class="chip-btn" aria-pressed="${k===0}">${esc(v.name)}</button>`).join("")}</div>`:""}
    <div class="tl-wrap">${view(w.views[0])}</div>
    <div class="wnote">המוקדם בימין, המאוחר בשמאל. ${esc(w.note||"")}</div></div>`;
}

// Real Romm Vilna scans (800px wide). Rects and crops are in page pixels; everything is drawn in percentages.
const pc=(a,b)=>(100*a/b).toFixed(3)+"%";
function amudName(a){ return gem(parseInt(a))+" "+(/a$/.test(a)?"ע״א":"ע״ב"); }
function hlBoxes(rects, ox, oy, w, h){ return rects.map(r=>`<div class="vhl" style="right:auto;left:${pc(r[0]-ox,w)};top:${pc(r[1]-oy,h)};width:${pc(r[2],w)};height:${pc(r[3],h)}"></div>`).join(""); }
function bandShade(rects, oy, h){
  const y0 = Math.min(...rects.map(r=>r[1])) - oy, y1 = Math.max(...rects.map(r=>r[1]+r[3])) - oy;
  return `<div class="vdim" style="top:0;height:${pc(Math.max(0,y0),h)}"></div><div class="vdim" style="top:${pc(y1,h)};bottom:0"></div><div class="vbar" style="top:${pc(y0,h)};height:${pc(y1-y0,h)}"></div>`;
}
function vImg(p, ox, oy, w, h){ return `<img src="${p.img}" alt="" loading="lazy" style="left:${pc(-ox,w)};top:${pc(-oy,h)};width:${pc(p.w,w)}">`; }
function vThumb(p, rects){ return `<div class="vthumb" data-vfull="${p.img}" data-h="${p.h}" data-r='${JSON.stringify(rects)}' style="aspect-ratio:${p.w}/${p.h}" title="הדף המלא">${vImg(p,0,0,p.w,p.h)}${hlBoxes(rects,0,0,p.w,p.h)}</div>`; }
function renderVilna(v){
  const book = DATA.daf.split(" ")[0];
  const rows = v.pages.map(p=>{ const [cx,cy,cw,ch]=p.crop;
    return `<div class="vrow"><div class="vcrop" data-vfull="${p.img}" data-h="${p.h}" data-r='${JSON.stringify(p.rects)}' style="aspect-ratio:${cw}/${ch};max-width:${Math.round(cw*2)}px">${vImg(p,cx,cy,cw,ch)}${bandShade(p.rects,cy,ch)}</div>
      <div>${vThumb(p,p.rects)}<div class="vcap">${esc(book)} ${esc(amudName(p.amud))}</div></div></div>${p.more?`<div class="vmore">הקטע ממשיך למטה. לחצו על הדף לראות את כולו.</div>`:""}`; }).join("");
  return `<div class="vilna"><div class="vhead"><b>בגמרא שלכם · ${esc(book)} ${v.pages.map(p=>esc(amudName(p.amud))).join(" ← ")}</b><span>מתחיל: <q>${esc(v.open)}</q></span></div>${rows}</div>`;
}
function renderCoverage(){
  const by = {}, order = [];
  S.forEach(s=>(s.vilna?s.vilna.pages:[]).forEach(p=>{ if(!by[p.img]){ by[p.img]={p, rects:[]}; order.push(p.img); } by[p.img].rects.push(...p.rects); }));
  if(!order.length) return "";
  const book = DATA.daf.split(" ")[0];
  return `<h2 class="panel-title" style="margin-top:18px">על הדף המודפס</h2><div class="vilna"><div class="vcover">${order.map(k=>`<div>${vThumb(by[k].p, by[k].rects)}<div class="vcap">${esc(book)} ${esc(amudName(by[k].p.amud))}</div></div>`).join("")}</div>
    <div class="vmore">המסומן הוא מה שנלמד היום. לחצו על עמוד לראות אותו בגודל מלא. דפוס ראם וילנא, המיקום מדויק לשורה או שתיים.</div></div>`;
}
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-vfull]"); if(!el) return;
  const r = JSON.parse(el.dataset.r), h = +el.dataset.h, m = document.createElement("div");
  m.className = "vmodal"; m.innerHTML = `<button class="vx" aria-label="סגירה">×</button><div class="vfull" style="aspect-ratio:800/${h}"><img src="${el.dataset.vfull}" alt="" style="left:0;top:0;width:100%">${hlBoxes(r,0,0,800,h)}</div>`;
  m.addEventListener("click", ev=>{ if(ev.target===m || ev.target.classList.contains("vx")) m.remove(); });
  document.body.appendChild(m);
  const f = m.querySelector(".vfull"); requestAnimationFrame(()=>{ const y = r.length? r[0][1]/h*f.offsetHeight : 0; m.scrollTop = Math.max(0, y-120); });
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ const m=document.querySelector(".vmodal"); if(m){ m.remove(); e.stopPropagation(); } } }, true);

function renderUnitTimeline(i){
  const T = DATA.timeline;
  const pts = T.points.filter(p=>p.from<=i && i<=p.until).map(p=>({...p, kind:[p.kind||"", p.on.includes(i)?"hi":"lo", p.fuzzy?"fuzzy":""].join(" ")}));
  const id="w"+Math.random().toString(36).slice(2,7);
  const w = {title:T.title, axis:T.axis, views:[{name:"", points:pts}], note:T.note};
  return renderTimeline(w, id).replace('class="widget"','class="widget unit-tl"');
}

function renderBands(w, id){
  const P = x => (x/w.max*100);
  return `<div class="widget" id="${id}"><h3>${esc(w.title)}</h3>
    <div class="bands">${w.rows.map(r=>`<div class="brow"><span class="blab">${esc(r.label)}</span><div class="btrack">${r.segs.map(([a,b,l])=>`<span class="bseg${l==="—"?" none":""}" style="inset-inline-start:${P(a)}%;width:${P(b-a)}%"><b>${esc(l)}</b></span>`).join("")}</div></div>`).join("")}
      <div class="brow"><span class="blab"></span><div class="baxis">${w.ticks.map(([a,l])=>l?`<span style="inset-inline-start:${P(a)}%">${esc(l)}</span>`:"").join("")}</div></div>
    </div><div class="wnote">${esc(w.note||"")}</div></div>`;
}

function renderSum(w, id){
  return `<div class="widget" id="${id}"><h3>${esc(w.title)}</h3>
    <div class="sum">${w.items.map(([l,v],k)=>`${k?`<span class="op">+</span>`:""}<span class="tile"><b>${esc(l)}</b><small>${v}</small></span>`).join("")}<span class="op">=</span><span class="tile total"><b>${w.total}</b><small>מצוות</small></span></div></div>`;
}

function renderLadder(w, id){
  const L = DATA.ladder, at = new Set(w.at), first = Math.min(...w.at);

      <span class="ln">${s.n}</span><span class="lw">${esc(s.who)}<small>${esc(s.src)}</small></span>${s.rejected?`<span class="lr">נדחה</span>`:""}</li>`).join("")}</ol></div>`;
}

function renderSukkah(w, id){
  const S0 = {...w.init}, C = new Set(w.controls);
  const ctl = [
    C.has("height") ? `<label class="sk-row"><span>גובה הסכך</span><input type="range" id="${id}_h" min="5" max="45" step="1" value="${S0.h}"><output id="${id}_ho"></output></label>` : "",
    C.has("width") ? `<label class="sk-row"><span>רוחב (אמות)</span><input type="range" id="${id}_w" min="4" max="10" step="1" value="${S0.width}"><output id="${id}_wo"></output></label>` : "",
    C.has("walls") ? `<label class="sk-chk"><input type="checkbox" id="${id}_walls" ${S0.walls?"checked":""}> הדפנות מגיעות עד הסכך</label>` : "",
    C.has("mountains") ? `<label class="sk-chk"><input type="checkbox" id="${id}_m" ${S0.mountains?"checked":""}> הרים מסביב (עשתרות קרנים)</label>` : "",
    C.has("iron") ? `<label class="sk-chk"><input type="checkbox" id="${id}_iron" ${S0.iron?"checked":""}> מחיצות של ברזל</label>` : "",
  ].join("");
  WIDGET_INIT.push(()=>{
    const root=document.getElementById(id); if(!root) return;
    const $$ = s => root.querySelector(s);
    const read = () => { const g=(k,d)=>{const el=document.getElementById(id+"_"+k); return el?(el.type==="checkbox"?el.checked:+el.value):d;};
      return {h:g("h",S0.h), width:g("w",S0.width), walls:g("walls",S0.walls), mountains:g("m",S0.mountains), iron:g("iron",S0.iron)}; };
    const draw = () => {
      const s = read(), k=5.4, G=282, Y=a=>G-a*k, cx=175, half=s.width*k/2, x0=cx-half, x1=cx+half;
      const over = s.h>20;
      const rab = !over ? [1,"עד 20 אמה העין רואה את הסכך"] : s.walls ? [1,"הדפנות מגיעות לסכך, והעין עולה איתן"] : [0,"״לא שלטא בה עינא״: העין לא מגיעה לסכך"];
      const zei = !over ? [1, s.mountains?"״דל עשתרות קרנים״: בלי ההרים יש צל סכך":"יושבים בצל הסכך"] : s.width>4 ? [1,"סוכה רחבה: יש מקום בצל הסכך"] : [0,"יושבים בצל הדפנות, לא בצל הסכך"];
      const rav = !over ? [1, s.iron?"גם בברזל: עד 20 אמה זה מבנה של עראי":"דירת עראי"] : [0,"מעל 20 אמה זו דירת קבע"];
      const wallH = s.walls ? s.h : Math.min(s.h*0.55, 12);
      const shadeOK = !over || s.width>4;
      const eyeY = Y(2.6);
      let svg = `<rect x="0" y="0" width="320" height="${G}" fill="var(--sky)"/>`;
      if(s.mountains) svg += `<path d="M-10 ${G} L60 ${Y(38)} L130 ${G} Z M190 ${G} L270 ${Y(40)} L340 ${G} Z" fill="var(--line)" opacity=".9"/>`;
      [10,20,30,40].forEach(a=>{ svg += `<line x1="30" x2="36" y1="${Y(a)}" y2="${Y(a)}" stroke="var(--muted)"/><text x="26" y="${Y(a)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${a}</text>`; });
      svg += `<line x1="33" x2="33" y1="${Y(45)}" y2="${G}" stroke="var(--muted)" stroke-width=".8"/>`;
      svg += `<line x1="36" x2="316" y1="${Y(20)}" y2="${Y(20)}" stroke="var(--t-kushya)" stroke-dasharray="5 4" stroke-width="1.2"/><text x="314" y="${Y(20)-5}" text-anchor="end" font-size="11" fill="var(--t-kushya)">20 אמה</text>`;
      const wallFill = s.iron ? "var(--ink)" : "var(--t-verse)";
      svg += `<rect x="${x0-3}" y="${Y(wallH)}" width="3" height="${wallH*k}" fill="${wallFill}"/><rect x="${x1}" y="${Y(wallH)}" width="3" height="${wallH*k}" fill="${wallFill}"/>`;
      if(!s.walls && wallH < s.h) svg += `<line x1="${x0-1.5}" x2="${x0-1.5}" y1="${Y(s.h)}" y2="${Y(wallH)}" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="2 2"/><line x1="${x1+1.5}" x2="${x1+1.5}" y1="${Y(s.h)}" y2="${Y(wallH)}" stroke="var(--muted)" stroke-width=".8" stroke-dasharray="2 2"/>`;
      svg += `<rect x="${x0-7}" y="${Y(s.h)-5}" width="${x1-x0+14}" height="5" rx="1.5" fill="var(--sch)"/>`;
      // floor shade (principle only)
      if(shadeOK){ svg += `<rect x="${x0}" y="${G-4}" width="${x1-x0}" height="4" fill="var(--sch)" opacity=".55"/>`; if(over) svg += `<rect x="${x0}" y="${G-4}" width="${k*1.2}" height="4" fill="var(--muted)"/><rect x="${x1-k*1.2}" y="${G-4}" width="${k*1.2}" height="4" fill="var(--muted)"/>`; }
      else svg += `<rect x="${x0}" y="${G-4}" width="${x1-x0}" height="4" fill="var(--muted)" opacity=".8"/>`;
      // person
      svg += `<circle cx="${cx}" cy="${Y(3.1)}" r="2.6" fill="var(--ink)"/><line x1="${cx}" x2="${cx}" y1="${Y(2.7)}" y2="${Y(1.2)}" stroke="var(--ink)" stroke-width="2"/><line x1="${cx}" x2="${cx-3}" y1="${Y(1.2)}" y2="${G}" stroke="var(--ink)" stroke-width="1.6"/><line x1="${cx}" x2="${cx+3}" y1="${Y(1.2)}" y2="${G}" stroke="var(--ink)" stroke-width="1.6"/>`;
      // eye line (Rabbah)
      if(w.focus==="rabbah"||w.focus==="all"){ const ok=rab[0]; const ty = ok? Y(s.h) : Math.max(Y(s.h), Y(20));
        svg += `<line x1="${cx}" y1="${Y(3.1)}" x2="${cx+ (ok?0:0)}" y2="${ty}" stroke="${ok?"var(--t-answer)":"var(--muted)"}" stroke-width="1.3" stroke-dasharray="${ok?"":"3 3"}"/>`; }
      svg += `<line x1="0" x2="320" y1="${G}" y2="${G}" stroke="var(--ink)" stroke-width="1.2"/>`;
      svg += `<text x="${x1+8}" y="${Y(s.h)+4}" font-size="11" fill="var(--sch)">סכך</text>`;
      svg += `<text x="${cx}" y="${G+14}" text-anchor="middle" font-size="11" fill="${shadeOK?"var(--sch)":"var(--muted)"}">${shadeOK?"צל סכך":"צל דפנות"}</text>`;
      $$("svg").innerHTML = svg;
      const ho = document.getElementById(id+"_ho"); if(ho) ho.textContent = `${s.h} אמה, בערך ${(s.h*.48).toFixed(1)} עד ${(s.h*.58).toFixed(1)} מטר`;
      const wo = document.getElementById(id+"_wo"); if(wo) wo.textContent = s.width===4 ? "4×4 בדיוק" : `${s.width}×${s.width}`;
      const row = (who, r, f) => `<div class="sk-st${w.focus!=="all"&&w.focus!==f?" dim":""}"><span class="chip ${r[0]?"ok":"bad"}">${r[0]?"כשרה":"פסולה"}</span><b>${who}</b><span>${esc(r[1])}</span></div>`;
      $$(".sk-status").innerHTML = row("רבה",rab,"rabbah")+row("ר׳ זירא",zei,"zeira")+row("רבא",rav,"rava")+`<div class="sk-st dim"><span class="chip ok">כשרה</span><b>ר׳ יהודה</b><span>מכשיר בכל מקרה</span></div>`;
    };
    root.querySelectorAll("input").forEach(i=>i.addEventListener("input",draw)); draw();
  });
  return `<div class="widget sk" id="${id}"><h3>סוכה בחתך: שחקו עם הגובה</h3>
    <div class="sk-grid"><svg viewBox="0 0 320 300" style="direction:ltr" role="img" aria-label="תרשים סוכה בחתך"></svg>
    <div class="sk-side">${ctl}<div class="sk-status"></div></div></div>
    <div class="wnote">בקנה מידה: אדם לעומת 20 אמה. אמה = 48–58 ס״מ לפי השיעורים המקובלים. הצל מוצג באופן עקרוני, לפי הגמרא.</div></div>`;
}

function renderWidget(w){
  const id="w"+Math.random().toString(36).slice(2,7);
  if(w.type==="timeline") return renderTimeline(w,id);
  if(w.type==="sum") return renderSum(w,id);
  if(w.type==="bands") return renderBands(w,id);
  if(w.type==="ladder") return renderLadder(w,id);
  if(w.type==="sukkah") return renderSukkah(w,id);
  if(w.type==="photo") return `<figure class="widget photo"><img src="${esc(w.src)}" alt="${esc(w.caption)}" loading="lazy"><figcaption>${esc(w.caption)} <a href="${esc(w.page)}" target="_blank" rel="noopener">${esc(w.credit)}</a></figcaption></figure>`;
  if(w.type==="links") return `<div class="widget links"><h3>${esc(w.title)}</h3><div class="lnks">${w.links.map(l=>`<a class="chip-btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>${w.note?`<div class="wnote">${esc(w.note)}</div>`:""}</div>`;
  if(w.type==="figure") return `<div class="widget fig"><h3>${esc(w.title)}</h3><div class="figsvg">${w.svg}</div>${w.note?`<div class="wnote">${esc(w.note)}</div>`:""}</div>`;
  if(w.type==="diff"){
    WIDGET_INIT.push(()=>{ const root=document.getElementById(id); if(!root) return;
      const calc=()=>{ const v=[...root.querySelectorAll("input")].map(i=>parseFloat(i.value)||0); root.querySelector(".dres b").textContent=(v[0]-v[1]).toLocaleString("he-IL")+" "+w.unit; };
      root.querySelectorAll("input").forEach(i=>i.oninput=calc); calc(); });
    return `<div class="widget" id="${id}"><h3>${esc(w.title)}</h3>
      <div class="dfields">${w.fields.map(([l,v],k)=>`<label><span>${esc(l)}</span><input id="${id}_${k}" type="number" min="0" value="${v}" inputmode="decimal"> <small>${esc(w.unit)}</small></label>`).join("")}</div>
      <div class="dres">${esc(w.result)}: <b></b></div>
      <div class="wnote">${esc(w.note)}</div></div>`;
  }
  const base=w.views[0].rows;
  const table = v => `<table><thead><tr>${w.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    v.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>ci===0?`<td class="rowh">${esc(c)}</td>`:`<td class="${c!==base[ri][ci]?"diff":""}${c==="✓"?" yes":c==="✗"?" no":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  WIDGET_INIT.push(()=>{
    const root=document.getElementById(id); if(!root) return;
    root.querySelectorAll(".wtabs button").forEach((b,k)=>b.onclick=()=>{
      root.querySelectorAll(".wtabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      root.querySelector(".tbl-wrap").innerHTML=table(w.views[k]);
    });
  });
  return `<div class="widget" id="${id}"><h3>${esc(w.title)}</h3>
    ${w.views.length>1?`<div class="wtabs">${w.views.map((v,k)=>`<button class="chip-btn" aria-pressed="${k===0}">${esc(v.name)}</button>`).join("")}</div>`:""}
    <div class="tbl-wrap">${table(w.views[0])}</div>
    ${w.views.length>1?`<div class="wnote">תא מודגש: מה שמשתנה לעומת ״${esc(w.views[0].name)}״</div>`:""}</div>`;
}

function setActive(id, lock){
  st.active=id; if(lock!==undefined) st.locked=lock;
  const cols=$("#cols"); if(!cols) return;
  cols.classList.toggle("has-active",!!id);
  cols.querySelectorAll("[data-n]").forEach(el=>el.classList.toggle("on",el.dataset.n===id));
}
function wireSlide(s){
  const cols=$("#cols");
  cols.querySelectorAll(".node, .gtext [data-n], .verse[data-n], .geo .gp[data-n]").forEach(el=>{
    el.addEventListener("mouseenter",()=>{ if(!st.locked) setActive(el.dataset.n); });
    el.addEventListener("mouseleave",()=>{ if(!st.locked) setActive(null); });
    el.addEventListener("click",()=>{ if(el.classList.contains("hidden-step")) return;
      if(st.locked && st.active===el.dataset.n) setActive(null,false); else setActive(el.dataset.n,true); });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.click(); }});
  });
  $("#rev").onclick=()=>{ st.reviewed.has(s.id)?st.reviewed.delete(s.id):st.reviewed.add(s.id); store.set(dk("reviewed"),[...st.reviewed]); renderSlide(); renderProgress(); };
}

      </section>`:""}
      <section class="panel">
        <h2 class="panel-title">נחשו לפני שלומדים</h2>
        <p style="margin:0 0 12px;font-size:.92rem;color:var(--muted)">ניחוש לפני הלימוד עוזר לזכור, גם כשהוא שגוי. התשובות יופיעו בסוף הדף.</p>
        <div class="quiz">${DATA.pretest.map((p,k)=>`<div class="qi"><div class="q">${k+1}. ${esc(p.q)}</div>
          <div class="row">${p.options.map(o=>`<button class="opt" data-k="${k}" aria-pressed="${st.pre[k]===o}">${esc(o)}</button>`).join("")}</div></div>`).join("")}</div>
      </section>
      </div>
    </div>`;
  document.querySelectorAll(".review .qi").forEach(el=>{
    const j=+el.dataset.j, x=st.revItems[j];
    const sh=el.querySelector(".show"); if(sh) sh.onclick=()=>{ el.querySelector(".ans").hidden=false; sh.remove(); el.querySelectorAll(".yes,.no").forEach(b=>b.hidden=false); };
    el.querySelectorAll(".yes,.no").forEach(b=>b.onclick=()=>{
      const v=b.classList.contains("yes")?"yes":"no"; st.rev[j]=v; store.set(dk("rev"),st.rev);
      const src=store.get(dk("quiz",x.daf.id),{}); src[x.k]=v; store.set(dk("quiz",x.daf.id),src);
      renderMap(); });
  });
  document.querySelectorAll(".maprow").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  document.querySelectorAll(".tree button").forEach(b=>b.onclick=()=>go(+b.dataset.s));
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ st.pre[b.dataset.k]=b.textContent; store.set(dk("pre"),st.pre); renderMap(); });
}

function renderSummary(){
  const tot=st.times.reduce((a,b)=>a+b,0), T=k=>st.times[k+1], mx=Math.max(1,...S.map((_,k)=>T(k)));
  const answered=Object.values(st.quiz).filter(v=>v!=null).length, knew=Object.values(st.quiz).filter(v=>v==="yes").length;
  $("#stage").innerHTML=`
    <div class="head"><div>
      <div class="eyebrow">${esc(DATA.daf)} · סיום</div>
      <h1>חזרה ומדידה</h1>
      <div class="speakers"><span class="spk">${st.reviewed.size} מתוך ${N} שקפים סומנו כנבדקים</span></div>
    </div></div>
    <section class="panel dinim">
      <h2 class="panel-title">${esc(DATA.summaryTitle||"סיכום הדינים של הדף")} · חצי דקה</h2>
      <ol>${DATA.dinim.map(x=>`<li>${bold(x)}</li>`).join("")}</ol>
    </section>
    ${DATA.pretest.some((p,k)=>st.pre[k])?`<section class="panel pre-check">
      <h2 class="panel-title">הניחושים שלכם מתחילת הדף</h2>
      ${DATA.pretest.map((p,k)=>`<div class="pq"><div class="q">${esc(p.q)}</div><div class="guess">ניחשתם: ${esc(st.pre[k]||"לא נענה")}</div><div class="ans">${esc(p.a)}</div></div>`).join("")}
    </section>`:""}
    <div class="sum-grid">
      <section class="panel">
        <h2 class="panel-title">זמן לימוד</h2>
        <div class="total">${fmt(tot)}</div>
        <p style="margin:2px 0 14px;color:var(--muted);font-size:.9rem">הזמן נמדד רק כשהדף פתוח ומוצג.</p>
        <div class="times">${S.map((s,k)=>`<div class="trow"><span class="n" title="${esc(s.title)}">${k+1}. ${esc(s.title)}</span><div class="barbg"><div class="barf" style="width:${(T(k)/mx*100).toFixed(1)}%"></div></div><span class="v">${fmt(T(k))}</span></div>`).join("")}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
          <button class="chip-btn" id="copy">העתק תוצאות</button>
          <button class="chip-btn" id="reset">איפוס זמנים ותשובות</button>
          <span class="copied" id="copied" hidden>הועתק</span>
        </div>
        <textarea class="copybox" id="copybox" readonly hidden></textarea>
      </section>
      <section class="panel">
        <p style="margin:0 0 10px;font-size:.92rem;color:var(--muted)">קודם עונים בקול או מסבירים לחברותא, ורק אחר כך פותחים את התשובה.</p>
        <h2 class="panel-title">שאלות חזרה <span class="score" id="score">${answered?`· ${knew}/${answered} ידעתי`:""}</span></h2>
        <div class="quiz">${DATA.quiz.map((q,k)=>{const v=st.quiz[k];return `<div class="qi" data-k="${k}">
          <div class="q">${k+1}. ${esc(q.q)}</div>
          <div class="ans" ${v?"":"hidden"}>${esc(q.a)}</div>
          <div class="row">${v?"":`<button class="show">הצג תשובה</button>`}
            <button class="yes" aria-pressed="${v==="yes"}" ${v?"":"hidden"}>ידעתי</button>
            <button class="no" aria-pressed="${v==="no"}" ${v?"":"hidden"}>לא ידעתי</button></div></div>`}).join("")}</div>
      </section>
    </div>
    ${LIB.pilot?`<p class="pilot" style="margin-top:24px">${esc(LIB.pilot.note)}</p>`:""}<p class="credits">${esc(DATA.credits)} הביאור והמהלך נכתבו לדוגמה על בסיס ביאור הרב שטיינזלץ בספריא, ויש לבדוק אותם לפני שיעור. הקישור ״בספריא עם שטיינזלץ״ בכל שקף פותח את המקור.</p>`;
  document.querySelectorAll(".qi").forEach(el=>{
    const k=+el.dataset.k;
    const sh=el.querySelector(".show"); if(sh) sh.onclick=()=>{ el.querySelector(".ans").hidden=false; sh.remove(); el.querySelectorAll(".yes,.no").forEach(b=>b.hidden=false); };
    el.querySelectorAll(".yes,.no").forEach(b=>b.onclick=()=>{ st.quiz[k]=b.classList.contains("yes")?"yes":"no"; store.set(dk("quiz"),st.quiz); renderSummary(); });
  });
  const text=()=>[`${DATA.daf} · דף בריצה`,`זמן כולל: ${fmt(tot)}`,`מפת הדף: ${fmt(st.times[0])}`,...S.map((s,k)=>`${k+1}. ${s.title}: ${fmt(T(k))}`),`חזרה: ${fmt(st.times[N+1])}`,`שאלות: ${knew}/${DATA.quiz.length} ידעתי (${answered} נענו)`,`חזרה מרווחת: ${st.revItems.map((x,j)=>st.rev[j]?(x.daf.daf+" ש"+(x.k+1)+": "+(st.rev[j]==="yes"?"ידעתי":"לא ידעתי")):"").filter(Boolean).join(" | ")||"לא נענתה"}`,`ניחושים בפתיחה: ${DATA.pretest.map((p,k)=>st.pre[k]?(k+1)+") "+st.pre[k]:"").filter(Boolean).join(" | ")}`].join("\n");
  $("#copy").onclick=()=>{
    const t=text(), ok=()=>{$("#copied").hidden=false};
    try{ navigator.clipboard.writeText(t).then(ok,()=>fallback(t)); }catch(e){ fallback(t); }
  };
  const fallback=t=>{ const b=$("#copybox"); b.hidden=false; b.value=t; b.focus(); b.select(); };
  $("#reset").onclick=()=>{ st.times=new Array(N+2).fill(0); st.quiz={}; st.pre={}; st.rev={}; ["times","quiz","pre","rev"].forEach(k=>store.set(dk(k), k==="times"?st.times:{})); renderSummary(); };
}

function renderProgress(){
  $("#progress").innerHTML = [`<button class="${st.i===-1?"cur":"done"}" title="מפת הדף" aria-label="מפת הדף"></button>`, ...S.map((s,k)=>`<button class="${k<st.i?"done":""} ${k===st.i?"cur":""} ${st.reviewed.has(s.id)?"ok":""}" title="${k+1}. ${esc(s.title)}" aria-label="שקף ${k+1}"></button>`),
    `<button class="${st.i===N?"cur":""}" title="חזרה ומדידה" aria-label="סיכום"></button>`].join("");
  $("#progress").querySelectorAll("button").forEach((b,k)=>b.onclick=()=>go(k-1));
}
function render(){
  st.active=null; st.locked=false;
  if(st.i<0) renderMap(); else if(st.i<N) renderSlide(); else renderSummary();
  renderProgress();
  $("#prev").disabled = st.i===-1;
  $("#next").disabled = st.i===N;
  $("#next").textContent = st.i===-1 ? "מתחילים ←" : st.i===N-1 ? "לסיכום ←" : "הבא ←";
  const lesson = st.mode==="lesson" && st.i<N && st.i>=0;
  $("#step").hidden = !lesson;
  if(lesson){ const tot=buildSeq(S[st.i]).length; $("#step").disabled = st.step>=tot; $("#step").textContent = st.step>=tot ? "הכל נחשף" : `הצעד הבא (${st.step}/${tot})`; }
  $("#keys").textContent = lesson ? "רווח: הצעד הבא · חיצים: מעבר שקף" : "חיצים למעבר · לחיצה על צומת מדגישה את הטקסט";
  $("#mStudy").setAttribute("aria-pressed",st.mode==="study"); $("#mLesson").setAttribute("aria-pressed",st.mode==="lesson");
  $("#tExplain").setAttribute("aria-pressed",st.explain);
}
function go(k){ st.i=Math.max(-1,Math.min(N,k)); st.step=0; render(); window.scrollTo({top:0}); }
function stepFwd(){ if(st.mode!=="lesson"||st.i>=N||st.i<0){ go(st.i+1); return; }
  const tot=buildSeq(S[st.i]).length; if(st.step<tot){ st.step++; render(); } else go(st.i+1); }

$("#prev").onclick=()=>go(st.i-1);
$("#next").onclick=()=>go(st.i+1);
$("#step").onclick=stepFwd;
$("#mStudy").onclick=()=>{ st.mode="study"; store.set("mode","study"); render(); };
$("#mLesson").onclick=()=>{ st.mode="lesson"; st.step=0; store.set("mode","lesson"); render(); };
$("#tExplain").onclick=()=>{ st.explain=!st.explain; store.set("explain",st.explain); render(); };
document.addEventListener("keydown",e=>{
  if(e.target.closest("textarea,input")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); go(st.i+1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); go(st.i-1); }
  else if(e.key===" " && !e.target.closest("button,[role=button]")){ e.preventDefault(); stepFwd(); }
  else if(e.key==="Escape"){ setActive(null,false); }
});

let last=performance.now();
setInterval(()=>{
  const now=performance.now(), dt=(now-last)/1000; last=now;
  if(document.visibilityState==="visible" && dt<5){ st.times[st.i+1]+=dt; }
  $("#timer").textContent=fmt(st.times.reduce((a,b)=>a+b,0));
  if(Math.random()<.2) store.set(dk("times"),st.times);
},1000);
addEventListener("pagehide",()=>store.set(dk("times"),st.times));


// ---- optional study layers ----
st.opts = Object.assign({qs:false, bagrut:false, lessons:false}, store.get("opts", {}));
const OPT_IDS = {qs:"optQs", bagrut:"optBagrut", lessons:"optLessons"};
function syncDeepBtn(){ const n=Object.values(st.opts).filter(Boolean).length; $("#tDeep").textContent = n ? `העמקה · ${n}` : "העמקה"; $("#tDeep").setAttribute("aria-pressed", n>0); }
Object.entries(OPT_IDS).forEach(([k,id])=>{ const el=document.getElementById(id); el.checked=!!st.opts[k];
  el.onchange=()=>{ st.opts[k]=el.checked; store.set("opts",st.opts); syncDeepBtn(); if(st.i>=0&&st.i<N) renderSlide(); }; });
$("#tDeep").onclick=()=>{ const pnl=$("#deepPanel"); pnl.hidden=!pnl.hidden; $("#tDeep").setAttribute("aria-expanded", !pnl.hidden); };
syncDeepBtn();
const safeUrl = u => /^https?:\/\/[^\s"'<>]+$/i.test(u||"") ? u : null;
function slideDaf(s){ const r = s.refs[0] || (S.find(x=>x.refs.length)||{refs:["2a:1"]}).refs[0]; const d=r.split(":")[0]; return {n:parseInt(d), a:/a$/.test(d)?"א":"ב", ref:r}; }
function autoLessons(s){
  const L = DATA.lessons; if(!L) return [];
  const {n,a,ref} = slideDaf(s), pad = String(n).padStart(3,"0");
  return [
    {label:`הדרן: שיעור על דף ${gem(n)}`, url:`https://hadran.org.il/he/daf/${L.hadran}-${n}_he/`},
    {label:`טבלאות כולל עיון הדף`, url:`https://www.dafyomi.co.il/${L.kih}${pad}.htm`},
    {label:`ספריא + שטיינזלץ`, url:sefaria(ref)},
    {label:`חיפוש ביוטיוב`, url:`https://www.youtube.com/results?search_query=${encodeURIComponent(`${L.yt} דף ${gem(n)} עמוד ${a}`)}`}];
}
function renderDeep(s, hide){
  if(hide) return "";
  const parts=[];
  if(st.opts.qs && s.qs && s.qs.length) parts.push(`<section class="dsec"><h2>שאלות הבנה</h2>${s.qs.map((x,k)=>`<div class="dq"><div class="q">${k+1}. ${esc(x.q)}</div><p class="a" hidden>${esc(x.a)}</p><button class="dbtn" data-show>הצג תשובה</button></div>`).join("")}</section>`);
  if(st.opts.bagrut && s.bagrut){ const b=s.bagrut;
    const meta = b.real ? `<span class="badge real">שאלה מבחינת בגרות</span>שאלון ${esc(b.exam.code)} · ${esc(b.exam.name)} · ${esc(b.exam.year)} · ${esc(b.exam.q)} · <a href="${esc(b.exam.url)}" target="_blank" rel="noopener">השאלון המקורי ↗</a>${b.key?` · <a href="${esc(b.key.url)}" target="_blank" rel="noopener">דגם התשובות ↗</a>`:""}`
                        : `<span class="badge own">ניסוח עצמי</span>לא נמצאה שאלת בגרות על הסוגיה הזו; השאלה נכתבה כאן בסגנון בגרות.`;
    const src = b.answerSource==="key" ? `<span class="src">מתוך ${esc(b.key.label)}</span>` : `<span class="src own">תשובה מוצעת (ניסוח עצמי, לא רשמית)</span>`;
    parts.push(`<section class="dsec bag"><h2>שאלת בגרות · סוף הסוגיה</h2><div class="sug">${esc(b.sugya)}</div><div class="bmeta">${meta}</div>
      <p class="btext">${esc(b.text)}</p><div class="bans" hidden>${src}${esc(b.answer)}</div><button class="dbtn" data-show>הצג תשובה</button>
      ${b.more&&b.more.length?`<ul class="more">${b.more.map(m=>`<li>עוד: <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)} ↗</a>${m.key?` · <a href="${esc(m.key)}" target="_blank" rel="noopener">תשובות ↗</a>`:""}</li>`).join("")}</ul>`:""}</section>`); }
  if(st.opts.lessons){ const mine = store.get(dk("lessons:"+s.id), []);
    parts.push(`<section class="dsec" id="lessons"><h2>שיעורים על הדף</h2><div class="lnk">${autoLessons(s).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
      <div class="wnote">קישורים שנבנים אוטומטית לפי המסכת והדף. ביוטיוב זה חיפוש בלבד.</div>
      ${mine.length?`<ul class="mine">${mine.map((m,k)=>`<li><a href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.t||m.u)}</a><button class="dbtn" data-del="${k}">הסרה</button></li>`).join("")}</ul>`:""}
      <button class="dbtn" id="addL" style="margin-top:10px">+ הוסף שיעור</button>
      <form class="addf" id="addF" hidden><input id="lUrl" type="url" placeholder="https://..." aria-label="קישור לשיעור" required><input id="lTitle" class="t" type="text" placeholder="שם השיעור (לא חובה)" aria-label="שם השיעור">
        <div class="row"><button class="dbtn" type="submit">שמירה</button><button class="dbtn" type="button" id="addX">ביטול</button></div><div class="err" id="lErr" hidden>הקישור צריך להתחיל ב־https:// או http://</div></form></section>`); }
  return parts.length ? `<div class="deep">${parts.join("")}</div>` : "";
}
function wireDeep(s){
  document.querySelectorAll(".deep [data-show]").forEach(b=>b.onclick=()=>{ const box=b.parentElement.querySelector(".a,.bans"); box.hidden=!box.hidden; b.textContent=box.hidden?"הצג תשובה":"הסתר תשובה"; });
  const key=dk("lessons:"+s.id), add=$("#addL"), f=$("#addF");
  if(add){ add.onclick=()=>{ f.hidden=false; add.hidden=true; $("#lUrl").focus(); };
    $("#addX").onclick=()=>{ f.hidden=true; add.hidden=false; };
    f.onsubmit=e=>{ e.preventDefault(); const u=safeUrl($("#lUrl").value.trim()); if(!u){ $("#lErr").hidden=false; return; }
      const list=store.get(key,[]); list.push({u, t:$("#lTitle").value.trim().slice(0,120)}); store.set(key,list); renderSlide(); };
  }
  document.querySelectorAll(".deep [data-del]").forEach(b=>b.onclick=()=>{ const list=store.get(key,[]); list.splice(+b.dataset.del,1); store.set(key,list); renderSlide(); });
}

$("#dafSel").innerHTML = [...new Set(LIB.library.map(d=>d.group))].map(g=>`<optgroup label="${esc(g)}">${LIB.library.map((d,k)=>d.group===g?`<option value="${k}">${esc(d.daf)} · ${esc(d.kind)}</option>`:"").join("")}</optgroup>`).join("");
$("#dafSel").onchange = e => { store.set(dk("times"),st.times); loadDaf(+e.target.value); try{history.replaceState(null,"","#d"+DATA.id)}catch(_){} render(); window.scrollTo({top:0}); };
const fromHash = (location.hash.match(/^#d(\w+)$/)||[])[1];
const startId = fromHash || store.get("daf", LIB.start);
loadDaf(Math.max(0, LIB.library.findIndex(d=>d.id===startId)));
render();
</script>
